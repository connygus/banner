<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Isometric Trading Chart + Algo</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    width: 100%;
    height: 100%;
  }
  canvas { display: block; }

  .panel {
    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 14px 18px;
    border-radius: 12px;
    border: 1.5px solid rgba(0, 0, 0, 0.85);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    pointer-events: none;
    user-select: none;
  }
  .panel-stack {
    position: fixed;
    bottom: 24px;
    right: 24px;
    display: flex;
    flex-direction: row;
    align-items: flex-end;
    gap: 14px;
    z-index: 10;
  }
  #overlay { min-width: 200px; }
  #algo    { min-width: 220px; }

  /* LEFT SIDE: banner content — replace inner HTML with your own */
  .banner-content {
    position: fixed;
    top: 50%;
    left: 6%;
    transform: translateY(-50%);
    width: 44%;
    max-width: 620px;
    z-index: 10;
    pointer-events: auto;
  }
  /* Eyebrow / brand mark above the headline */
  .banner-content .eyebrow {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: #FF4F55;
    margin-bottom: 18px;
  }
  .banner-content h1 {
    font-size: clamp(30px, 3.6vw, 46px);
    font-weight: 800;
    line-height: 1.08;
    margin: 0 0 22px 0;
    color: #333;
    letter-spacing: -1.0px;
    max-width: 540px;
  }
  .banner-content h1 .tm {
    font-size: 0.48em;
    font-weight: 600;
    vertical-align: super;
    color: #888;
    margin-left: 2px;
  }
  .banner-content p.ingress {
    font-size: clamp(14px, 1.1vw, 16px);
    line-height: 1.6;
    margin: 0 0 14px 0;
    color: #555;
    max-width: 500px;
  }
  .banner-content p.compat {
    font-size: 12px;
    line-height: 1.4;
    margin: 0 0 28px 0;
    color: #888;
    max-width: 500px;
  }
  .banner-content p.compat strong {
    color: #666;
    font-weight: 600;
  }

  /* CTA base (used by the waitlist join button) */
  .cta {
    padding: 13px 24px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.3px;
    border-radius: 10px;
    cursor: pointer;
    border: none;
    font-family: inherit;
    transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.2s ease;
  }
  .cta:hover { transform: translateY(-1px); }
  .cta-primary {
    background: #51C951;
    color: #fff;
    box-shadow: 0 2px 8px rgba(81, 201, 81, 0.22);
  }
  .cta-primary:hover {
    background: #46b546;
    box-shadow: 0 6px 18px rgba(81, 201, 81, 0.30);
  }

  /* Waitlist — boxless, inline typographic layout. */
  .waitlist {
    max-width: 460px;
    margin-top: 8px;
  }
  .waitlist-head { margin-bottom: 18px; }
  .waitlist-eyebrow {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    color: #FF4F55;
    margin-bottom: 6px;
  }
  .waitlist-title {
    font-size: 22px;
    font-weight: 700;
    color: #333;
    letter-spacing: -0.4px;
  }
  .countdown {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 18px;
  }
  .countdown-timer {
    font-size: 34px;
    font-weight: 800;
    color: #333;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.8px;
    line-height: 1;
  }
  .countdown-label {
    font-size: 13px;
    font-weight: 500;
    color: #888;
  }
  .countdown-label sup {
    font-size: 0.75em;
    font-weight: 600;
  }
  .waitlist-form {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
    max-width: 420px;
  }
  .waitlist-input {
    flex: 1;
    padding: 11px 14px;
    font-size: 14px;
    font-family: inherit;
    border: 1px solid rgba(51, 51, 51, 0.18);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.9);
    color: #333;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
    min-width: 0;
  }
  .waitlist-input::placeholder { color: #aaa; }
  .waitlist-input:focus {
    outline: none;
    border-color: #51C951;
    box-shadow: 0 0 0 3px rgba(81, 201, 81, 0.15);
  }
  .waitlist-form .cta {
    padding: 11px 18px;
    white-space: nowrap;
  }
  .waitlist-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: #666;
    line-height: 1.5;
  }
  .waitlist-meta strong { color: #333; font-weight: 700; }
  .waitlist-meta .subtle { color: #999; }
  .waitlist-meta .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #51C951;
    box-shadow: 0 0 0 3px rgba(81, 201, 81, 0.18);
    flex-shrink: 0;
  }
  .waitlist-joined {
    padding: 12px 16px;
    color: #fff;
    font-weight: 600;
    background: #51C951;
    border-radius: 8px;
    margin-bottom: 12px;
    max-width: 420px;
  }

  .label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.2px;
    color: #888;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  #price {
    font-size: 28px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: #111;
    letter-spacing: -0.5px;
    line-height: 1.1;
  }
  .replay-title {
    margin-bottom: 14px;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(0, 0, 0, 0.06);
    line-height: 1.25;
  }
  .replay-title .rt-main {
    font-size: 20px;
    font-weight: 700;
    color: #111;
    letter-spacing: -0.4px;
  }
  .replay-title .rt-range {
    font-size: 13px;
    font-weight: 600;
    color: #444;
    margin-top: 4px;
    font-variant-numeric: tabular-nums;
  }
  .replay-title .rt-sub {
    font-size: 11px;
    font-weight: 500;
    color: #888;
    margin-top: 2px;
  }
  .replay-title .asterisk { color: #bbb; }
  .bar-time {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid rgba(0, 0, 0, 0.06);
    font-size: 15px;
    font-weight: 600;
    color: #333;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.2px;
  }
  #latentGain {
    font-size: 28px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.5px;
    line-height: 1.1;
    margin-top: 4px;
  }
  .latent-block {
    padding-top: 4px;
    border-top: 1px solid rgba(0, 0, 0, 0.06);
    margin-top: 8px;
  }
  .top-right-stack {
    position: fixed;
    top: 88px;
    right: 32px;
    z-index: 20;
    pointer-events: none;
    user-select: none;
    text-align: right;
    /* Scale overlay to match the ~33% reduction of the Three.js scene below.
       Transform origin = top-right so the block still hugs the top-right
       corner after scaling. */
    transform: scale(0.75);
    transform-origin: top right;
  }
  .replay-title-floating {
    line-height: 1.25;
  }
  .replay-title-floating .rt-main {
    font-size: 20px;
    font-weight: 700;
    color: #111;
    letter-spacing: -0.4px;
  }
  .replay-title-floating .rt-range {
    font-size: 13px;
    font-weight: 600;
    color: #444;
    margin-top: 4px;
    font-variant-numeric: tabular-nums;
  }
  .replay-title-floating .rt-sub {
    font-size: 11px;
    font-weight: 500;
    color: #888;
    margin-top: 2px;
  }
  .replay-title-floating .asterisk { color: #bbb; }

  .recent-trades-floating {
    margin-top: 18px;
    text-align: right;
  }
  .rt-trades-label {
    font-size: 11px;
    font-weight: 700;
    color: #888;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .recent-trades-floating #recentTradesList {
    display: flex;
    flex-direction: column;
    gap: 4px;
    align-items: flex-end;
  }

  /* Matrix-style pseudo-code stream — sits under Recent Trades. Lines appear
     at the bottom and scroll up as more come in; oldest ones fade out. */
  .codestream {
    margin-top: 10px;
    text-align: right;
    width: 280px;
  }
  .codestream-lines {
    height: 170px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    font-family: "SF Mono", Menlo, Monaco, "Courier New", monospace;
    font-size: 11px;
    line-height: 1.5;
    position: relative;
    -webkit-mask-image: linear-gradient(to bottom,
      transparent 0%,
      rgba(0,0,0,0.2) 12%,
      rgba(0,0,0,0.75) 30%,
      #000 50%);
    mask-image: linear-gradient(to bottom,
      transparent 0%,
      rgba(0,0,0,0.2) 12%,
      rgba(0,0,0,0.75) 30%,
      #000 50%);
  }
  .cs-line {
    color: #333;  /* brand dark grey, not green — only event lines are colored */
    white-space: nowrap;
    overflow: hidden;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.25s ease, transform 0.25s ease;
    font-variant-numeric: tabular-nums;
  }
  .cs-line.show { opacity: 1; transform: translateY(0); }
  .cs-line .prompt { color: #888; margin-right: 4px; }
  .cs-line .kw { color: #555; }
  .cs-line .num { color: #333; font-weight: 600; }

  /* Trade event lines — bright green for long, bright red for short. */
  .cs-line.event-long {
    color: #2f9b2f;
    font-weight: 700;
    background: rgba(81, 201, 81, 0.08);
    padding: 1px 6px;
    margin: 1px -6px;
    border-left: 2px solid #51C951;
  }
  .cs-line.event-long .prompt { color: #51C951; }
  .cs-line.event-short {
    color: #d03a3f;
    font-weight: 700;
    background: rgba(255, 79, 85, 0.08);
    padding: 1px 6px;
    margin: 1px -6px;
    border-left: 2px solid #FF4F55;
  }
  .cs-line.event-short .prompt { color: #FF4F55; }
  .cs-line.event-win {
    color: #2f9b2f;
    font-weight: 700;
  }
  .cs-line.event-loss {
    color: #d03a3f;
    font-weight: 700;
  }

  .latent-block-top {
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid rgba(0, 0, 0, 0.06);
  }
  .recent-trades {
    margin-top: 0;
    padding-top: 0;
    border-top: none;
  }
  #recentTradesList {
    margin-top: 6px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .trade-row {
    display: inline-grid;
    grid-template-columns: auto auto auto;
    gap: 8px;
    align-items: center;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    transition: opacity 1.1s ease, transform 1.1s ease;
  }
  .trade-row-entering {
    opacity: 0;
    transform: translateY(-8px);
  }
  .trade-row-leaving {
    opacity: 0;
    transform: translateY(8px);
  }
  .trade-side {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.4px;
    padding: 2px 6px;
    border-radius: 4px;
    text-transform: uppercase;
  }
  .trade-side.long  { background: rgba(81, 201, 81, 0.18); color: #2f9b2f; }
  .trade-side.short { background: rgba(255, 79, 85, 0.18); color: #d03a3f; }
  .trade-time { color: #999; font-size: 10px; }
  .trade-pnl  { font-weight: 600; }
  .trade-pnl.up   { color: #2f9b2f; }
  .trade-pnl.down { color: #d03a3f; }
  .no-trades { color: #bbb; font-size: 12px; font-style: italic; }
  .ohlc {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid rgba(0, 0, 0, 0.06);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px 18px;
    font-size: 12px;
    color: #555;
    font-variant-numeric: tabular-nums;
  }
  .ohlc div b {
    color: #aaa;
    font-weight: 600;
    margin-right: 6px;
    display: inline-block;
    width: 10px;
  }

  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 4px 0;
    font-size: 12px;
    gap: 24px;
    font-variant-numeric: tabular-nums;
  }
  .row > span:first-child {
    color: #888;
    font-size: 10px;
    letter-spacing: 0.8px;
    text-transform: uppercase;
  }
  .row > span:last-child {
    font-weight: 600;
    color: #333;
  }
  #algoStatus {
    font-size: 10px;
    padding: 3px 9px;
    border-radius: 6px;
    background: rgba(0,0,0,0.05);
    color: #666 !important;
    letter-spacing: 0.5px;
  }
  #algoStatus.active {
    background: rgba(81, 201, 81, 0.18);
    color: #2f9b2f !important;
  }
  #algoStatus.active.short {
    background: rgba(255, 79, 85, 0.18);
    color: #d03a3f !important;
  }

  #hint {
    position: fixed;
    bottom: 20px;
    right: 24px;
    font-size: 11px;
    color: #bbb;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    pointer-events: none;
    user-select: none;
  }

  #loading {
    position: fixed;
    inset: 0;
    background: rgba(255, 255, 255, 0.96);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    z-index: 100;
    transition: opacity 0.4s ease;
  }
  #loading.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .loading-spinner {
    width: 32px;
    height: 32px;
    border: 3px solid rgba(0, 0, 0, 0.08);
    border-top-color: #51C951;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text {
    font-size: 12px;
    color: #888;
    letter-spacing: 0.8px;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<!-- Floating top-right corner: title + recent trades (no box). -->
<div id="topRight" class="top-right-stack">
  <div id="replayTitle" class="replay-title-floating">
    <div class="rt-main">Replay of S&amp;P 500 algo</div>
    <div class="rt-range" id="replayRange">&nbsp;</div>
    <div class="rt-sub">With position size 100x</div>
  </div>
  <div class="recent-trades-floating">
    <div class="rt-trades-label">Recent Trades</div>
    <div id="recentTradesList"><div class="no-trades">No closed trades yet</div></div>
  </div>

  <!-- Matrix-style pseudo-code stream. Continuously prints lines; entries
       and exits are highlighted in brand colors. -->
  <div class="codestream">
    <div class="rt-trades-label">Algo · live</div>
    <div id="codeStream" class="codestream-lines"></div>
  </div>
</div>

<div id="loading">
  <div class="loading-spinner"></div>
  <div class="loading-text">Loading S&amp;P 500 data…</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  // ============ SCENE ============
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xffffff);

  let aspect = window.innerWidth / window.innerHeight;
  // Frustum scaled up so the chart renders ~25% smaller on screen. The
  // orthographic camera now captures more world content per screen pixel,
  // which scales down all candles, planes, labels, and markers uniformly.
  const frustumSize = 43;
  // Chart is biased slightly to the right of center. 0 = centered,
  // 0.25 = chart in right half, negative = bias left.
  const RIGHT_HALF_PAN = 0.17;

  function computeFrustum() {
    const halfW = frustumSize * aspect / 2;
    const pan = frustumSize * aspect * RIGHT_HALF_PAN;
    return {
      left:   -halfW - pan,
      right:   halfW - pan,
      top:     frustumSize / 2,
      bottom: -frustumSize / 2,
    };
  }

  const f0 = computeFrustum();
  const camera = new THREE.OrthographicCamera(
    f0.left, f0.right, f0.top, f0.bottom, -200, 1000
  );
  // More 3D (~35° elevation, ~33° azimuth). Higher Y reveals more of the
  // top face of each candle, reading as more 3D without flattening the
  // diagonal sweep.
  camera.position.set(17, 22, 26);
  camera.lookAt(0, 0, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  window.addEventListener('resize', () => {
    aspect = window.innerWidth / window.innerHeight;
    const f = computeFrustum();
    camera.left   = f.left;
    camera.right  = f.right;
    camera.top    = f.top;
    camera.bottom = f.bottom;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ============ LIGHTING ============
  scene.add(new THREE.AmbientLight(0xffffff, 0.82));
  const dir1 = new THREE.DirectionalLight(0xffffff, 0.45);
  dir1.position.set(15, 30, 15);
  scene.add(dir1);
  const dir2 = new THREE.DirectionalLight(0xffffff, 0.18);
  dir2.position.set(-15, 10, -20);
  scene.add(dir2);

  // ============ GROUPS ============
  const rotationGroup = new THREE.Group();
  scene.add(rotationGroup);

  // Grid lives directly on the scene — it's the static floor and should not
  // translate down with the chart as the baseline rises.
  const grid = new THREE.GridHelper(120, 60, 0xd6d6d6, 0xdddddd);
  grid.position.y = -12;
  grid.material.opacity = 0.6;
  grid.material.transparent = true;
  // Parent to rotationGroup (not scene) so mouse tilt rotates the grid
  // together with the candles and trade planes.
  rotationGroup.add(grid);

  // ============ ROUNDED-BOX HELPER ============
  // r128 has no RoundedBoxGeometry — build one from an extruded rounded-rect shape.
  function makeRoundedBox(width, height, depth, radius, smoothness = 3) {
    const r = Math.min(radius, width / 2 - 0.001, depth / 2 - 0.001);
    if (height < r * 2 + 0.001) {
      return new THREE.BoxGeometry(width, height, depth);
    }
    const shape = new THREE.Shape();
    const w = width / 2 - r;
    const d = depth / 2 - r;
    shape.absarc( w,  d, r, 0, Math.PI / 2, false);
    shape.absarc(-w,  d, r, Math.PI / 2, Math.PI, false);
    shape.absarc(-w, -d, r, Math.PI, Math.PI * 1.5, false);
    shape.absarc( w, -d, r, Math.PI * 1.5, Math.PI * 2, false);

    const geom = new THREE.ExtrudeGeometry(shape, {
      depth: height - r * 2,
      bevelEnabled: true,
      bevelSegments: smoothness,
      steps: 1,
      bevelSize: r,
      bevelThickness: r,
      curveSegments: smoothness
    });
    geom.center();
    geom.rotateX(-Math.PI / 2); // stand it up so Y = height
    return geom;
  }

  // ============ CONSTANTS ============
  const GREEN_HEX = 0x51C951;
  const RED_HEX   = 0xFF4F55;

  const CANDLE_W    = 0.95;
  const CANDLE_D    = 0.95;
  const BODY_RADIUS = 0.22;
  const WICK_W      = 0.105;

  const SPACING         = 1.22;
  // PRICE_SCALE and BASE_PRICE are recomputed once real data loads, so the
  // chart auto-fits to whatever the actual S&P price range is.
  let   PRICE_SCALE     = 1.5;
  let   BASE_PRICE      = 100;
  // Y position for time-axis slabs on the floor. Computed from the first
  // ~45 bars after real data loads, so labels sit at an aesthetic distance
  // below the opening candles (what most users see first).
  let   TIME_SLAB_Y     = -13.5;
  const CANDLE_DURATION = 2000;
  const MAX_CANDLES     = 32;
  const LATEST_X        = 13;

  const priceToY = p => (p - BASE_PRICE) * PRICE_SCALE;

  // ============ CANDLE ============
  class Candle {
    constructor(open) {
      this.open  = open;
      this.high  = open;
      this.low   = open;
      this.close = open;
      this.isGreen = true;
      this.markers = [];

      this.group = new THREE.Group();

      // Wicks: TWO cylinders — one above the body, one below the body.
      // Splitting them prevents the wick from showing through the body during
      // the transparent fade-out on the chart's left edge.
      this.wickMat = new THREE.MeshLambertMaterial({ color: 0x3a3a3a,
        transparent: true, opacity: 1 });
      this.wickUp = new THREE.Mesh(
        new THREE.CylinderGeometry(WICK_W / 2, WICK_W / 2, 1, 12),
        this.wickMat
      );
      this.wickDn = new THREE.Mesh(
        new THREE.CylinderGeometry(WICK_W / 2, WICK_W / 2, 1, 12),
        this.wickMat
      );
      this.group.add(this.wickUp, this.wickDn);

      // Body: CAPSULE — cylinder middle + two TRUE hemispheres for the caps.
      // Hemispheres are proper half-globes (full SphereGeometry slice from
      // pole to equator), giving a uniformly rounded top and bottom rather
      // than an extruded elliptical dome.
      this.bodyMat = new THREE.MeshLambertMaterial({ color: GREEN_HEX,
        transparent: true, opacity: 1 });
      const R = CANDLE_W / 2;
      this.bodyCyl = new THREE.Mesh(
        new THREE.CylinderGeometry(R, R, 1, 32),
        this.bodyMat
      );
      // Top half-globe.
      this.bodyTop = new THREE.Mesh(
        new THREE.SphereGeometry(R, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2),
        this.bodyMat
      );
      // Bottom half-globe.
      this.bodyBot = new THREE.Mesh(
        new THREE.SphereGeometry(R, 32, 16, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2),
        this.bodyMat
      );
      this.body = new THREE.Group();
      this.body.add(this.bodyCyl, this.bodyTop, this.bodyBot);
      this.group.add(this.body);
      // Keep R around for the update method.
      this.bodyR = R;

      this.update(open);
    }

    // Set opacity on all materials under this candle (wick, body, markers,
    // text sprites). Used by the scroll loop to fade old candles away.
    setOpacity(o) {
      this.wickMat.opacity = o;
      this.bodyMat.opacity = o;
      for (const m of this.markers) {
        if (m.material) m.material.opacity = o;
      }
    }

    update(price) {
      this.close = price;
      if (price > this.high) this.high = price;
      if (price < this.low)  this.low  = price;

      const newIsGreen = this.close >= this.open;
      if (newIsGreen !== this.isGreen) {
        this.isGreen = newIsGreen;
        const hex = newIsGreen ? GREEN_HEX : RED_HEX;
        // Wick stays black; only the body color follows direction.
        this.bodyMat.color.setHex(hex);
      }

      // Compute price → world Y for the candle's key levels first; the body
      // boundaries drive where the upper and lower wicks stop/start.
      const highY  = priceToY(this.high);
      const lowY   = priceToY(this.low);
      const openY  = priceToY(this.open);
      const closeY = priceToY(this.close);
      const bTop = Math.max(openY, closeY);
      const bBot = Math.min(openY, closeY);

      // Account for the body's actual rendered Y-extent (capsule rounds out
      // slightly beyond bTop/bBot when H < 2R due to cap squashing). For the
      // simple case (H >= 2R) the visible body sits exactly in [bBot, bTop].
      // Upper wick: from bTop up to high.
      const wickUpH = Math.max(highY - bTop, 0.001);
      this.wickUp.scale.y = wickUpH;
      this.wickUp.position.y = (bTop + highY) / 2;
      this.wickUp.visible = highY > bTop + 0.005;
      // Lower wick: from low up to bBot.
      const wickDnH = Math.max(bBot - lowY, 0.001);
      this.wickDn.scale.y = wickDnH;
      this.wickDn.position.y = (lowY + bBot) / 2;
      this.wickDn.visible = bBot > lowY + 0.005;

      // Body: capsule with true hemisphere caps. The cylinder takes
      // H - 2*R of the total height; each hemisphere contributes R.
      // If H < 2*R, the cylinder collapses and hemispheres squash to
      // make the body's Y-extent equal H exactly.
      const H     = Math.max(bTop - bBot, 0.05);
      const R     = this.bodyR;
      const useFull = H >= 2 * R;
      const cylH  = useFull ? H - 2 * R : 0.001;
      const capSy = useFull ? 1 : H / (2 * R);
      this.bodyCyl.scale.y    = cylH;
      this.bodyCyl.position.y = 0;
      this.bodyTop.position.y =  cylH / 2;
      this.bodyBot.position.y = -cylH / 2;
      this.bodyTop.scale.y = capSy;
      this.bodyBot.scale.y = capSy;
      this.body.position.y = (bTop + bBot) / 2;
    }

    dispose() {
      this.wickUp.geometry.dispose();
      this.wickDn.geometry.dispose();
      this.bodyCyl.geometry.dispose();
      this.bodyTop.geometry.dispose();
      this.bodyBot.geometry.dispose();
      this.wickMat.dispose();
      this.bodyMat.dispose();
      for (const m of this.markers) {
        if (m.geometry) m.geometry.dispose();
        if (m.material) {
          if (m.material.map) m.material.map.dispose();
          m.material.dispose();
        }
      }
    }
  }

  // ============ PRICE SIMULATION ============
  let currentPrice = BASE_PRICE;

  // Wave is a sequence of randomly-sized swings (no fixed cycle, never repeats).
  // Up swings: 4-12 candles, ~0.85-1.40 price/candle.
  // Down swings: 3-8 candles, ~0.65-1.10 price/candle (smaller per candle than
  // up, AND fewer candles on average → strong net uptrend).
  const UP_LEN_MIN   = 4,   UP_LEN_MAX   = 12;
  const DOWN_LEN_MIN = 3,   DOWN_LEN_MAX = 8;
  const UP_AMP_MIN   = 0.85, UP_AMP_MAX   = 1.40; // per candle
  const DOWN_AMP_MIN = 0.65, DOWN_AMP_MAX = 1.10; // per candle

  const swings = [];

  function rand(min, max) { return min + Math.random() * (max - min); }

  // Seedable PRNG for DETERMINISTIC algo decisions — so trade entries/exits
  // happen at the same candles on every reload. mulberry32 is tiny and fast.
  // Only used for algo cooldown jitter and fake-trade P&L variation; real
  // price data stays untouched and is already deterministic.
  function makeSeededRng(seed) {
    let s = seed >>> 0;
    return function () {
      s = (s + 0x6D2B79F5) >>> 0;
      let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  // Fixed seed → deterministic sequence. Reload = same trade timing.
  let algoRng = makeSeededRng(0xC0FFEE);
  function randInt(min, max) { return Math.floor(rand(min, max + 1)); }

  function generateNextSwing() {
    const last = swings[swings.length - 1];
    const startTime  = last ? last.endTime  : 0;
    const startPrice = last ? last.endPrice : BASE_PRICE;
    // Alternate direction. First swing is up.
    const direction = (!last || last.direction === 'down') ? 'up' : 'down';

    let candleCount, delta;
    if (direction === 'up') {
      candleCount = randInt(UP_LEN_MIN, UP_LEN_MAX);
      delta =  candleCount * rand(UP_AMP_MIN, UP_AMP_MAX);
    } else {
      candleCount = randInt(DOWN_LEN_MIN, DOWN_LEN_MAX);
      delta = -candleCount * rand(DOWN_AMP_MIN, DOWN_AMP_MAX);
    }

    swings.push({
      startTime,
      endTime: startTime + candleCount * CANDLE_DURATION,
      startPrice,
      endPrice: startPrice + delta,
      direction,
    });
  }

  // Find (or generate) the swing containing simulated time t.
  function getSwingAt(t) {
    while (!swings.length || swings[swings.length - 1].endTime <= t) {
      generateNextSwing();
    }
    for (let i = swings.length - 1; i >= 0; i--) {
      const s = swings[i];
      if (s.startTime <= t && t < s.endTime) return s;
    }
    return swings[0];
  }

  // Smoothed EMA of actual price — used for chart positioning since the rise
  // rate is variable now. Tracks the real trend instead of a fixed formula.
  let smoothedTrendline = BASE_PRICE;
  // Estimated long-run rise rate (price units / second), used only to size
  // the static UPTREND_LIFT — not for anything live.
  const ESTIMATED_RISE_PER_SECOND = 0.18;

  const PREFILL_COUNT = MAX_CANDLES - 1;
  // UPTREND_LIFT shifts the chart upward so the latest candle sits near the
  // top of view and the oldest near the bottom — producing a clear diagonal.
  // Mutable: recomputed once the real-data scale is known.
  let UPTREND_LIFT = ESTIMATED_RISE_PER_SECOND * MAX_CANDLES *
                     (CANDLE_DURATION / 1000) * 0.5 * PRICE_SCALE;
  // simStartTime is shifted into the past so the chart loads already "full".
  // Mutable: shifted forward on loop wrap in real-data mode.
  let simStartTime = performance.now() - PREFILL_COUNT * CANDLE_DURATION;

  // virtualNow overrides the clock during prefill so swing / algo decisions
  // evaluate at historical timestamps.
  let virtualNow = null;
  const nowMs = () => (virtualNow !== null ? virtualNow : performance.now());
  const getBaseline = () => smoothedTrendline;

  // ============ REAL-DATA LAYER ============
  // dataMode: 'real' once Yahoo bars load; 'synthetic' if fetch fails.
  let dataMode = 'synthetic';
  let bars = null;            // loaded array of {time, open, high, low, close}
  let dataSwings = null;      // pre-computed swing extrema for algo lookahead
  let realSymbol = '';        // '^GSPC' or 'SPY'
  // Timestamps of the hour range we're replaying — displayed in the title.
  let replayWindowStart = 0, replayWindowEnd = 0;
  // start playback at the bar after the prefilled history, so we always have
  // PREFILL_COUNT bars of "past" to render and plenty of "future" to look ahead.
  let dataStartBarIdx = 0;
  // LOOP_LENGTH: how many bars we cycle through. Set at init time to the
  // smaller of ~60 (1 hour of data) or whatever fits the buffer.
  let LOOP_LENGTH = 60;

  // Fetch SPY/^GSPC 1-minute bars via Yahoo Finance (routed through a CORS
  // proxy because Yahoo doesn't allow direct browser requests). Tries multiple
  // symbols and proxies — returns null if everything fails.
  async function fetchMarketBars() {
    const symbols = [
      { code: '%5EGSPC', label: 'S&P 500 (^GSPC)' },
      { code: 'SPY',     label: 'SPY (S&P 500 ETF)' },
    ];
    const proxies = [
      // Primary: user's own Cloudflare Worker — reliable, no public rate limits.
      url => `https://snowy-paper-7a2f.yellow-bonus-7895.workers.dev/?url=${encodeURIComponent(url)}`,
      // Fallback if the Worker is down.
      url => 'https://corsproxy.io/?' + encodeURIComponent(url),
    ];
    for (const sym of symbols) {
      for (const proxy of proxies) {
        try {
          const yahooUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${sym.code}?interval=1m&range=5d`;
          const proxiedUrl = proxy(yahooUrl);
          console.log('[chart] fetching', sym.label, 'via', new URL(proxiedUrl).host);
          const res = await fetch(proxiedUrl, { cache: 'no-store' });
          if (!res.ok) {
            console.warn('[chart] fetch returned', res.status, 'for', sym.label);
            continue;
          }
          const j = await res.json();
          const r = j?.chart?.result?.[0];
          if (!r || !r.timestamp || !r.indicators?.quote?.[0]) {
            console.warn('[chart] unexpected response shape for', sym.label);
            continue;
          }
          const ts = r.timestamp;
          const q  = r.indicators.quote[0];
          const out = [];
          for (let i = 0; i < ts.length; i++) {
            if (q.open[i] == null || q.high[i] == null ||
                q.low[i]  == null || q.close[i] == null) continue;
            out.push({
              time:  ts[i] * 1000,
              open:  q.open[i],
              high:  q.high[i],
              low:   q.low[i],
              close: q.close[i],
            });
          }
          if (out.length > MAX_CANDLES + 10) {
            console.log('[chart] loaded', out.length, 'bars for', sym.label,
              '— latest:', new Date(out[out.length-1].time).toLocaleString());
            return { bars: out, symbol: sym.label };
          }
          console.warn('[chart] not enough bars for', sym.label, '(' + out.length + ')');
        } catch (e) {
          console.warn('[chart] fetch error:', e.message);
        }
      }
    }
    console.warn('[chart] all market-data sources failed — using synthetic mode');
    return null;
  }

  // Zigzag-style swing detection: walks bars and records confirmed extrema
  // whenever price reverses by at least `threshold` from the running extreme.
  function computeSwings(bars, threshold = 0.0008) {
    const out = [];
    if (bars.length === 0) return out;
    let dir = null;
    let extIdx   = 0;
    let extPrice = bars[0].close;
    for (let i = 1; i < bars.length; i++) {
      const p = bars[i].close;
      if (dir === null) {
        if ((p - extPrice) / extPrice >=  threshold) {
          out.push({ barIdx: extIdx, price: extPrice, type: 'low' });
          dir = 'up'; extIdx = i; extPrice = p;
        } else if ((extPrice - p) / extPrice >= threshold) {
          out.push({ barIdx: extIdx, price: extPrice, type: 'high' });
          dir = 'down'; extIdx = i; extPrice = p;
        }
      } else if (dir === 'up') {
        if (p > extPrice) { extIdx = i; extPrice = p; }
        else if ((extPrice - p) / extPrice >= threshold) {
          out.push({ barIdx: extIdx, price: extPrice, type: 'high' });
          dir = 'down'; extIdx = i; extPrice = p;
        }
      } else { // 'down'
        if (p < extPrice) { extIdx = i; extPrice = p; }
        else if ((p - extPrice) / extPrice >= threshold) {
          out.push({ barIdx: extIdx, price: extPrice, type: 'low' });
          dir = 'up'; extIdx = i; extPrice = p;
        }
      }
    }
    return out;
  }

  // Find swings as simple local extrema: a bar is a "high" if its close is
  // greater than every close within `radius` bars on each side, and a "low"
  // if strictly less. Guaranteed to find something in any non-flat window.
  function findLocalExtrema(bars, startIdx, endIdx, radius = 4) {
    const out = [];
    let lastType = null;
    for (let i = startIdx + radius; i < endIdx - radius; i++) {
      let isHigh = true, isLow = true;
      for (let j = 1; j <= radius; j++) {
        if (bars[i - j].close >= bars[i].close || bars[i + j].close > bars[i].close) isHigh = false;
        if (bars[i - j].close <= bars[i].close || bars[i + j].close < bars[i].close) isLow  = false;
        if (!isHigh && !isLow) break;
      }
      if (isHigh && lastType !== 'high') {
        out.push({ barIdx: i, price: bars[i].close, type: 'high' });
        lastType = 'high';
      } else if (isLow && lastType !== 'low') {
        out.push({ barIdx: i, price: bars[i].close, type: 'low' });
        lastType = 'low';
      }
    }
    return out;
  }

  // Smoothly interpolate within a bar:
  //   open → first extreme → second extreme → close.
  // Green bar follows open → low → high → close (typical bullish path).
  // Red bar follows  open → high → low → close.
  function interpolateBar(bar, t) {
    const goesUp = bar.close >= bar.open;
    const w = [
      { t: 0.00, p: bar.open },
      { t: 0.30, p: goesUp ? bar.low  : bar.high },
      { t: 0.70, p: goesUp ? bar.high : bar.low  },
      { t: 1.00, p: bar.close },
    ];
    let i = 0;
    while (i < w.length - 1 && t > w[i + 1].t) i++;
    const a = w[i], b = w[i + 1] || w[i];
    if (a.t === b.t) return a.p;
    const u = (t - a.t) / (b.t - a.t);
    const eased = u * u * (3 - 2 * u); // smoothstep
    return a.p + (b.p - a.p) * eased;
  }

  // Given simulated time t, what's the bar index we're playing?
  function getBarIdxAt(t) {
    return dataStartBarIdx + Math.floor(t / CANDLE_DURATION);
  }

  // Wrap a raw bar index into our loop window. Prefill bars (before the loop
  // window) use their actual historical index; live playback past the end of
  // the window cycles back to dataStartBarIdx.
  function wrapBarIdx(idx) {
    if (idx < dataStartBarIdx) return idx; // prefill: actual historical bar
    const offset = idx - dataStartBarIdx;
    return dataStartBarIdx + (offset % LOOP_LENGTH);
  }

  // Find the next swing after a given bar index, wrapping around the loop
  // window if no forward swing remains — so the algo always has a target.
  function findNextSwingAfter(barIdx) {
    if (!dataSwings || dataSwings.length === 0) return null;
    for (const s of dataSwings) if (s.barIdx > barIdx) return s;
    return dataSwings[0]; // wrap to first
  }

  // Sine-eased target price within the current swing. Smooth bodies, no kinks
  // at swing boundaries since each swing's endPrice = next swing's startPrice.
  function priceAtSimTime(t) {
    if (dataMode === 'real') {
      const idxFloat = dataStartBarIdx + t / CANDLE_DURATION;
      const idx = Math.floor(idxFloat);
      const localT = idxFloat - idx;
      const safeIdx = wrapBarIdx(idx);
      return interpolateBar(bars[safeIdx], localT);
    }
    const s = getSwingAt(t);
    const p = (t - s.startTime) / (s.endTime - s.startTime);
    return s.startPrice + (s.endPrice - s.startPrice) * 0.5 * (1 - Math.cos(p * Math.PI));
  }

  // Small smoothed noise for organic wick texture — kept low so candle
  // direction stays unambiguous against the wave move.
  let noiseState = 0;

  function tickPrice() {
    const t = nowMs() - simStartTime;
    const target = priceAtSimTime(t);
    // Real bars have natural texture, so add only minimal noise. Synthetic
    // wave is smooth, so it benefits from a touch more wiggle.
    const noiseAmp = dataMode === 'real' ? 0.0 : 0.10;
    noiseState = noiseState * 0.88 + (Math.random() - 0.5) * noiseAmp;
    currentPrice = target + noiseState;
    smoothedTrendline += (currentPrice - smoothedTrendline) * 0.005;
  }

  // ============ CHART STATE ============
  const candles = [];
  let currentCandle = null;
  let candleStartTime = performance.now();

  // Attach a small time label as a flat slab on the chart floor — same
  // orientation as the SL/TP/Entry planes. Runs if the bar timestamp falls
  // on a 5-minute boundary.
  const TIME_LABEL_INTERVAL_MIN = 5;
  function maybeAttachTimeLabel(candle) {
    if (dataMode !== 'real' || !bars) return;
    const t = nowMs() - simStartTime;
    const barIdx = wrapBarIdx(getBarIdxAt(t));
    const ts = bars[barIdx].time;
    const TZ = 'America/New_York';
    // Minutes in NY — check the 5-min boundary using NY time, not browser local.
    const nyMinutes = parseInt(
      new Date(ts).toLocaleString('en-US', { minute: 'numeric', timeZone: TZ }),
      10,
    );
    if (nyMinutes % TIME_LABEL_INTERVAL_MIN !== 0) return;
    const text = new Date(ts).toLocaleTimeString('en-GB', {
      hour: '2-digit', minute: '2-digit', hour12: false, timeZone: TZ,
    });

    // Draw text onto a canvas. The canvas becomes the TOP face texture of a
    // thin horizontal slab (same orientation as the SL/TP/Entry planes).
    const DPR = 2;
    const FONT = 'bold 28px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
    const measureCtx = document.createElement('canvas').getContext('2d');
    measureCtx.font = FONT;
    const textW = Math.ceil(measureCtx.measureText(text).width);
    const textH = 34;
    const PAD = 16;
    const canvas = document.createElement('canvas');
    canvas.width  = (textW + PAD * 2) * DPR;
    canvas.height = (textH + PAD * 2) * DPR;
    const ctx = canvas.getContext('2d');
    ctx.scale(DPR, DPR);
    // Transparent background — just the text pixels.
    ctx.font = FONT;
    ctx.textBaseline = 'top';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#aaa';
    ctx.fillText(text, (textW + PAD * 2) / 2, PAD);

    const tex = new THREE.CanvasTexture(canvas);
    tex.needsUpdate = true;
    tex.anisotropy = 8;

    // Slab dimensions in world units — same aspect as the text canvas,
    // same thin-box orientation as the SL/TP planes.
    const WORLD_PER_PX = 0.02;
    const slabW = (canvas.width  / DPR) * WORLD_PER_PX;   // X dimension
    const slabD = (canvas.height / DPR) * WORLD_PER_PX;   // Z dimension
    const slabT = 0.05;                                    // Y (thin)

    // Build a box that shows the texture ONLY on its top (+Y) face. The
    // other faces get an empty transparent material so we only see the
    // text from above. Easier: one MeshBasicMaterial with the texture, set
    // transparent. The sides are narrow enough that the stretched pixels
    // on them aren't visible from our camera angle.
    const mat = new THREE.MeshBasicMaterial({
      map: tex,
      transparent: true,
      depthWrite: false,
    });
    const slab = new THREE.Mesh(new THREE.BoxGeometry(slabW, slabT, slabD), mat);
    // Position: all time slabs at the SAME fixed Y so they're coplanar,
    // like time-axis labels painted on a single horizontal floor plane.
    // TIME_SLAB_Y is computed from the first 45 bars of the session so
    // labels are visually anchored below the opening candles.
    slab.position.y = TIME_SLAB_Y;
    slab.position.x = 0;
    slab.position.z = 0;
    slab.renderOrder = 4;
    candle.group.add(slab);
    candle.markers.push(slab);
  }

  function startCandle() {
    // Real-data loop wrap: when we've played through the whole window, shift
    // simStartTime forward so the mapping resets to dataStartBarIdx and we
    // start the replay over.
    if (dataMode === 'real') {
      const t = nowMs() - simStartTime;
      const rawIdx = getBarIdxAt(t);
      if (rawIdx >= dataStartBarIdx + LOOP_LENGTH) {
        simStartTime += LOOP_LENGTH * CANDLE_DURATION;
        // The previous cycle's trades are now "from the future" relative to
        // the replay time — clear them and reset the algo so the new cycle
        // starts fresh.
        if (algo.position !== 0) {
          // Realize the P&L but skip the exit marker (candle context is gone).
          const side = algo.position;
          const priceMove = side === 1
            ? currentPrice - algo.entryPrice
            : algo.entryPrice - currentPrice;
          const pnl = priceMove * POSITION_SIZE;
          algo.totalPnL += pnl;
          algo.totalTrades++;
          if (pnl > 0) algo.wins++; else algo.losses++;
          algo.position = 0;
          algo.entryPrice = 0;
          closeTradeViz();
        }
        recentTrades.length = 0;
        // Re-seed fake trades so the list always has 5 entries — avoids the
        // "No closed trades yet" placeholder flashing during loop wraps.
        seedFakeTrades();
        // Reset the seeded PRNG so trade timing is identical across loops.
        algoRng = makeSeededRng(0xC0FFEE);
        algo.cooldownUntilCandle = candleCounter + ENTRY_COOLDOWN_MIN;
      }
    }

    // The just-finalized candle is a closing event for the algo.
    if (currentCandle) algoOnCandleClose();

    const c = new Candle(currentPrice);
    rotationGroup.add(c.group);
    candles.push(c);
    currentCandle = c;
    candleStartTime = performance.now();
    maybeAttachTimeLabel(c);

    while (candles.length > MAX_CANDLES) {
      const old = candles.shift();
      rotationGroup.remove(old.group);
      old.dispose();
    }
  }

  // ============ TRADING ALGORITHM ============
  // Swing trader synced to the wave:
  //   On a swing flip the algo closes the current position and waits through
  //   a cooldown period before opening the opposite direction. This produces
  //   distinct exit + entry markers rather than a single swap.
  const algo = {
    position: 0,        // -1 = short, 0 = flat, 1 = long
    entryPrice: 0,
    stopLoss: 0,        // price level that would stop the trade out
    takeProfit: 0,      // price level where we expect the trade to exit
    totalTrades: 0,
    wins: 0,
    losses: 0,
    totalPnL: 0,
    cooldownUntilCandle: 0, // candle count at which new entries are allowed
  };
  let algoSwing = null;       // last swing the algo acted on
  let candleCounter = 0;      // incremented each time a candle closes
  // Position size in units (a "100x" notional makes $1 price move = $100 P&L).
  const POSITION_SIZE = 100;
  // Look back this many recent candles to find a structural swing low/high
  // that anchors the stop-loss just beyond it. Shorter lookback = closer SL.
  const SL_LOOKBACK_CANDLES = 5;
  // Small buffer added beyond the structural extreme.
  const SL_BUFFER_PCT = 0.00015;

  // Stop loss sits just beyond a recent structural low (long) or high (short)
  // — tighter than a fixed-percentage stop and anchored in actual structure.
  function computeStopLoss(side) {
    const N = Math.min(SL_LOOKBACK_CANDLES, candles.length);
    if (N === 0) return currentPrice * (1 - side * SL_BUFFER_PCT);
    const recent = candles.slice(-N);
    if (side === 1) {
      let lo = Infinity;
      for (const c of recent) if (c.low < lo) lo = c.low;
      return lo * (1 - SL_BUFFER_PCT);
    } else {
      let hi = -Infinity;
      for (const c of recent) if (c.high > hi) hi = c.high;
      return hi * (1 + SL_BUFFER_PCT);
    }
  }

  // Minimum reward-to-risk ratio. Trades where the potential profit isn't
  // at least 1.3× the potential loss are skipped. (Was 1.5 — too restrictive
  // for intraday S&P swings; 1.3 keeps selectivity but lets more setups
  // through.)
  const MIN_RR_RATIO = 1.3;

  // Take profit is placed at the next swing extreme — the algo will exit
  // around that price since that's where the swing flips. Always clamped to
  // the correct side of entry with a minimum distance.
  const MIN_TP_DIST_PCT = 0.0006; // TP at least 0.06% away from entry
  function computeTakeProfit(side) {
    let rawTP = null;
    if (dataMode === 'real') {
      const t = nowMs() - simStartTime;
      const idx = wrapBarIdx(getBarIdxAt(t));
      const next = findNextSwingAfter(idx);
      if (next) rawTP = next.price;
    } else {
      const t = nowMs() - simStartTime;
      const swing = getSwingAt(t);
      rawTP = swing.endPrice;
    }
    const entry = currentPrice;
    // Force TP on the correct side with a minimum distance.
    if (side === 1) {
      const minTP = entry * (1 + MIN_TP_DIST_PCT);
      return rawTP !== null ? Math.max(rawTP, minTP) : minTP * 1.5;
    } else {
      const maxTP = entry * (1 - MIN_TP_DIST_PCT);
      return rawTP !== null ? Math.min(rawTP, maxTP) : maxTP * 0.997;
    }
  }

  // Check whether a trade on `side` has acceptable R:R. Uses the SL and TP
  // that would be set at the current price; returns true if reward ≥ 1.5×risk.
  function hasFavorableRR(side) {
    const sl = computeStopLoss(side);
    const tp = computeTakeProfit(side);
    const risk   = Math.abs(currentPrice - sl);
    const reward = Math.abs(tp - currentPrice);
    if (risk <= 0) return false;
    return (reward / risk) >= MIN_RR_RATIO;
  }

  // Wait 4-5 candles (~8-10 seconds) after an exit before opening a new trade.
  const ENTRY_COOLDOWN_MIN = 4;
  const ENTRY_COOLDOWN_MAX = 5;

  // Recent closed trades (newest first). Rendered in the right-side panel.
  const recentTrades = [];
  let tradesVersion = 0;  // bump on every close so UI re-renders

  // Track chart markers (cones + sprites) belonging to the current open/most-
  // recent trade. When a NEW entry fires, these get demoted to "previous" and
  // scheduled for a dissolve animation after 2 candle closes.
  let currentTradeMarkers = [];   // [{obj, candle}, ...]
  let previousTradeMarkers = [];
  let previousTradeRemoveAtCandle = Infinity;
  // Markers currently dissolving (fading opacity → 0 over DISSOLVE_DURATION).
  const dissolvingMarkers = [];   // [{obj, candle, dissolveStart}, ...]
  const DISSOLVE_DURATION = 1000; // ms

  // Called by attachTradeMarker to register each cone/sprite against the
  // current trade lifecycle.
  function trackMarker(obj, candle) {
    currentTradeMarkers.push({ obj, candle });
  }

  // Demote current → previous and schedule removal. Called from algoBuy/Short
  // when a new entry opens.
  function rolloverTradeMarkers() {
    if (currentTradeMarkers.length === 0) return;
    // Any existing "previous" batch that hasn't started dissolving yet — kick
    // it straight into the dissolve queue so we don't pile up batches.
    startDissolve(previousTradeMarkers);
    previousTradeMarkers = [];
    previousTradeMarkers = currentTradeMarkers;
    currentTradeMarkers = [];
    previousTradeRemoveAtCandle = candleCounter + 2;
  }

  // Move a batch of markers into the dissolving state. Each marker is detached
  // from its candle's markers array so the candle's own fade logic doesn't
  // override the dissolve opacity curve.
  function startDissolve(markerList) {
    if (markerList.length === 0) return;
    const now = performance.now();
    for (const m of markerList) {
      if (m.candle) {
        const idx = m.candle.markers.indexOf(m.obj);
        if (idx >= 0) m.candle.markers.splice(idx, 1);
      }
      // Capture the current opacity as the starting point of the dissolve so
      // markers already partially faded (because their candle was aging out)
      // don't suddenly snap back to full opacity.
      const startOpacity = m.obj.material ? m.obj.material.opacity : 1;
      dissolvingMarkers.push({
        obj: m.obj,
        candle: m.candle,
        dissolveStart: now,
        startOpacity,
      });
    }
  }

  // Called on every candle close — starts the dissolve when the 2-candle
  // window has elapsed.
  function tickPreviousTradeMarkers() {
    if (previousTradeMarkers.length === 0) return;
    if (candleCounter >= previousTradeRemoveAtCandle) {
      startDissolve(previousTradeMarkers);
      previousTradeMarkers = [];
      previousTradeRemoveAtCandle = Infinity;
    }
  }

  // Called every frame — advances the dissolve and disposes fully-faded markers.
  function updateDissolvingMarkers() {
    if (dissolvingMarkers.length === 0) return;
    const now = performance.now();
    for (let i = dissolvingMarkers.length - 1; i >= 0; i--) {
      const m = dissolvingMarkers[i];
      const t = (now - m.dissolveStart) / DISSOLVE_DURATION;
      if (t >= 1) {
        // Done — remove from the scene and free resources.
        if (m.candle && m.candle.group) {
          m.candle.group.remove(m.obj);
        }
        if (m.obj.geometry) m.obj.geometry.dispose();
        if (m.obj.material) {
          if (m.obj.material.map) m.obj.material.map.dispose();
          m.obj.material.dispose();
        }
        dissolvingMarkers.splice(i, 1);
      } else if (m.obj.material) {
        m.obj.material.opacity = m.startOpacity * (1 - t);
      }
    }
  }

  // Populate the Recent Trades list with 5 plausible trades (4W 1L) from the
  // hour preceding the replay window. Times are spread across that hour;
  // prices are in the same range as the replay data.
  function seedFakeTrades() {
    if (!bars || !replayWindowStart) return;
    const hourBefore = replayWindowStart - 3600000;
    // Use a price level near the opening of the replay for realism.
    const refPrice = bars[dataStartBarIdx].open;
    // 5 entries, newest first (index 0 is most recent).
    const seeds = [
      { offsetMin: 54, side: 'Long',  pnl:  140 },
      { offsetMin: 42, side: 'Short', pnl:  -65 },
      { offsetMin: 30, side: 'Long',  pnl:  225 },
      { offsetMin: 18, side: 'Short', pnl:   90 },
      { offsetMin:  5, side: 'Long',  pnl:  180 },
    ];
    for (const s of seeds) {
      const t = hourBefore + s.offsetMin * 60000;
      const timeStr = new Date(t).toLocaleTimeString('en-GB', {
        hour: '2-digit', minute: '2-digit', hour12: false,
        timeZone: 'America/New_York',
      });
      // Fake entry/exit prices consistent with the P&L (not displayed, but
      // kept for data completeness). P&L was computed with POSITION_SIZE=100,
      // so price move = pnl / 100.
      const move = s.pnl / POSITION_SIZE;
      const entry = refPrice + (Math.random() - 0.5) * 2;
      const exit  = s.side === 'Long' ? entry + move : entry - move;
      recentTrades.push({
        side: s.side, pnl: s.pnl, time: timeStr, entry, exit,
      });
    }
    tradesVersion++;
  }

  // Active SL/TP monitoring: exit the moment price touches either level.
  function algoOnTick() {
    if (algo.position === 0) return;
    const p = currentPrice;
    if (algo.position === 1) {
      // Long: TP is above, SL below.
      if (p >= algo.takeProfit) algoClose();
      else if (p <= algo.stopLoss) algoClose();
    } else {
      // Short: TP is below, SL above.
      if (p <= algo.takeProfit) algoClose();
      else if (p >= algo.stopLoss) algoClose();
    }
  }

  // ============ MATRIX-STYLE CODE STREAM ============
  // Continuously prints dim pseudo-code lines. Trade entries/exits inject
  // bright green (long/win) or red (short/loss) lines into the stream.
  const codeStreamEl = document.getElementById('codeStream');
  const STREAM_MAX_LINES = 11;
  const STREAM_MIN_INTERVAL = 700;  // ms between background lines
  const STREAM_MAX_INTERVAL = 1400;
  let lastStreamLineAt = 0;
  let nextStreamLineDelay = STREAM_MIN_INTERVAL;
  let streamRotationIdx = 0;

  // Pool of trader-thought lines. Each line is tagged with state conditions
  // it's valid in ('up', 'down', 'range', 'long', 'short', 'flat', 'any').
  // streamBackgroundLine() evaluates current market state from recent candles
  // and picks only lines consistent with that state. Keeps the feed feeling
  // responsive — no "higher_high confirmed" during a red streak.
  function getMarketState() {
    const state = {
      isUp: false, isDown: false, isRange: true,
      recentHigh: currentPrice + 2, recentLow: currentPrice - 2,
      inTrade: algo.position !== 0,
      isLong: algo.position === 1,
      isShort: algo.position === -1,
      isFlat: algo.position === 0,
    };
    // Analyze the last 5 candles (if we have them).
    const N = Math.min(5, candles.length);
    if (N >= 3) {
      let greens = 0, reds = 0;
      let hi = -Infinity, lo = Infinity;
      const sample = candles.slice(-N);
      for (const c of sample) {
        if (c.close >= c.open) greens++; else reds++;
        if (c.high > hi) hi = c.high;
        if (c.low  < lo) lo = c.low;
      }
      const firstClose = sample[0].close;
      const lastClose  = sample[sample.length - 1].close;
      const delta = lastClose - firstClose;
      const range = Math.max(hi - lo, 0.01);
      // Declare a trend only if BOTH candle majority AND net price movement agree.
      if (greens >= 3 && delta > range * 0.2) state.isUp = true;
      else if (reds >= 3 && delta < -range * 0.2) state.isDown = true;
      if (state.isUp || state.isDown) state.isRange = false;
      state.recentHigh = hi;
      state.recentLow  = lo;
    }
    return state;
  }

  function streamBackgroundLine() {
    const s = getMarketState();
    // Each entry: [predicate_key, renderer_fn]. 'any' always passes.
    const pool = [
      // Always-valid lines (generic trader talk).
      ['any',   () => `<span class="prompt">&gt;</span> check rr_ratio`],
      ['any',   () => `<span class="prompt">&gt;</span> vwap = <span class="num">${fmtPrice1(currentPrice)}</span>`],
      ['any',   () => `<span class="prompt">&gt;</span> <span class="kw">if</span> rr &lt; <span class="num">1.3</span>: skip`],
      ['any',   () => `<span class="prompt">&gt;</span> liquidity check`],
      ['any',   () => `<span class="prompt">&gt;</span> order_book = clean`],
      ['any',   () => `<span class="prompt">&gt;</span> spread = tight`],
      ['any',   () => `<span class="prompt">&gt;</span> session vol = <span class="num">${(Math.abs(currentPrice - BASE_PRICE)).toFixed(1)}pt</span>`],
      ['any',   () => `<span class="prompt">&gt;</span> time-in-force = day`],
      ['any',   () => `<span class="prompt">&gt;</span> tick_size = 0.25`],

      // Uptrend — trend intact, longs favored.
      ['up',    () => `<span class="prompt">&gt;</span> higher_high confirmed`],
      ['up',    () => `<span class="prompt">&gt;</span> uptrend intact`],
      ['up',    () => `<span class="prompt">&gt;</span> bullish momentum`],
      ['up',    () => `<span class="prompt">&gt;</span> buyers in control`],
      ['up',    () => `<span class="prompt">&gt;</span> pullback @ <span class="num">${fmtPrice1(s.recentLow)}</span>?`],
      ['up',    () => `<span class="prompt">&gt;</span> bid_aggression rising`],
      ['up',    () => `<span class="prompt">&gt;</span> dip_buyers active`],
      ['up',    () => `<span class="prompt">&gt;</span> breakout watch`],
      ['up',    () => `<span class="prompt">&gt;</span> favor long bias`],

      // Downtrend — trend intact, shorts favored.
      ['down',  () => `<span class="prompt">&gt;</span> lower_low forming`],
      ['down',  () => `<span class="prompt">&gt;</span> downtrend intact`],
      ['down',  () => `<span class="prompt">&gt;</span> bearish momentum`],
      ['down',  () => `<span class="prompt">&gt;</span> sellers in control`],
      ['down',  () => `<span class="prompt">&gt;</span> bounce @ <span class="num">${fmtPrice1(s.recentHigh)}</span>?`],
      ['down',  () => `<span class="prompt">&gt;</span> offer_pressure rising`],
      ['down',  () => `<span class="prompt">&gt;</span> rally_sellers active`],
      ['down',  () => `<span class="prompt">&gt;</span> breakdown watch`],
      ['down',  () => `<span class="prompt">&gt;</span> favor short bias`],

      // Range / low-conviction.
      ['range', () => `<span class="prompt">&gt;</span> range_bound`],
      ['range', () => `<span class="prompt">&gt;</span> momentum = neutral`],
      ['range', () => `<span class="prompt">&gt;</span> awaiting confirmation`],
      ['range', () => `<span class="prompt">&gt;</span> chop detected`],
      ['range', () => `<span class="prompt">&gt;</span> setup invalid`],
      ['range', () => `<span class="prompt">&gt;</span> low_conviction`],
      ['range', () => `<span class="prompt">&gt;</span> indecision`],
      ['range', () => `<span class="prompt">&gt;</span> volume = thin`],
      ['range', () => `<span class="prompt">&gt;</span> no directional edge`],

      // Structural levels — dynamic from recent bars.
      ['any',   () => `<span class="prompt">&gt;</span> recent_high = <span class="num">${fmtPrice1(s.recentHigh)}</span>`],
      ['any',   () => `<span class="prompt">&gt;</span> recent_low  = <span class="num">${fmtPrice1(s.recentLow)}</span>`],
      ['up',    () => `<span class="prompt">&gt;</span> support @ <span class="num">${fmtPrice1(s.recentLow)}</span>`],
      ['down',  () => `<span class="prompt">&gt;</span> resistance @ <span class="num">${fmtPrice1(s.recentHigh)}</span>`],
      ['range', () => `<span class="prompt">&gt;</span> balance @ <span class="num">${fmtPrice1((s.recentHigh + s.recentLow) / 2)}</span>`],

      // In-trade — long.
      ['long',  () => `<span class="prompt">&gt;</span> holding LONG`],
      ['long',  () => `<span class="prompt">&gt;</span> monitor SL / TP`],
      ['long',  () => `<span class="prompt">&gt;</span> unrealized_pnl &gt; 0?`],
      ['long',  () => `<span class="prompt">&gt;</span> trail_stop eligible?`],
      ['long',  () => `<span class="prompt">&gt;</span> let_winners_run`],
      ['long',  () => `<span class="prompt">&gt;</span> respecting structure`],

      // In-trade — short.
      ['short', () => `<span class="prompt">&gt;</span> holding SHORT`],
      ['short', () => `<span class="prompt">&gt;</span> monitor SL / TP`],
      ['short', () => `<span class="prompt">&gt;</span> unrealized_pnl &gt; 0?`],
      ['short', () => `<span class="prompt">&gt;</span> trail_stop eligible?`],
      ['short', () => `<span class="prompt">&gt;</span> let_winners_run`],
      ['short', () => `<span class="prompt">&gt;</span> respecting structure`],

      // Flat / hunting for a setup.
      ['flat',  () => `<span class="prompt">&gt;</span> scanning structure`],
      ['flat',  () => `<span class="prompt">&gt;</span> no setup`],
      ['flat',  () => `<span class="prompt">&gt;</span> waiting for entry`],
      ['flat',  () => `<span class="prompt">&gt;</span> patience`],
      ['flat',  () => `<span class="prompt">&gt;</span> sitting on hands`],
      ['flat',  () => `<span class="prompt">&gt;</span> next_setup?`],
    ];

    // Build active-state set.
    const active = new Set(['any']);
    if (s.isUp)    active.add('up');
    if (s.isDown)  active.add('down');
    if (s.isRange) active.add('range');
    if (s.isLong)  active.add('long');
    if (s.isShort) active.add('short');
    if (s.isFlat)  active.add('flat');

    // Filter pool by active states.
    const valid = pool.filter(([key]) => active.has(key));
    // Pick deterministically-rotating through the valid subset so we don't
    // spam the same line twice in a row.
    const pick = valid[streamRotationIdx % valid.length][1]();
    streamRotationIdx++;
    return pick;
  }

  function appendStreamLine(html, extraClass) {
    if (!codeStreamEl) return;
    const div = document.createElement('div');
    div.className = 'cs-line' + (extraClass ? ' ' + extraClass : '');
    div.innerHTML = html;
    codeStreamEl.appendChild(div);
    // Reveal on next frame so CSS transition fires.
    requestAnimationFrame(() => {
      requestAnimationFrame(() => div.classList.add('show'));
    });
    // Prune oldest lines — flex-end alignment means DOM order matters:
    // oldest lines are at the top and get cut off by the mask gradient;
    // we physically remove them when count exceeds the cap.
    while (codeStreamEl.children.length > STREAM_MAX_LINES) {
      codeStreamEl.removeChild(codeStreamEl.firstChild);
    }
  }

  function tickCodeStream() {
    const now = performance.now();
    if (now - lastStreamLineAt < nextStreamLineDelay) return;
    lastStreamLineAt = now;
    // Randomize next interval so the stream doesn't tick mechanically.
    nextStreamLineDelay = STREAM_MIN_INTERVAL +
      Math.random() * (STREAM_MAX_INTERVAL - STREAM_MIN_INTERVAL);
    appendStreamLine(streamBackgroundLine());
  }

  // Log a trade event (entry or exit) as a cluster of 3-4 highlighted lines.
  function logStreamEvent(kind, side, extra) {
    const sideStr = side === 1 ? 'LONG' : 'SHORT';
    const evtClass = side === 1 ? 'event-long' : 'event-short';
    if (kind === 'entry') {
      appendStreamLine(
        `<span class="prompt">&gt;</span> entry_conditions: <strong>PASS</strong>`, evtClass);
      appendStreamLine(
        `<span class="prompt">&gt;</span> SL=${fmtPrice1(extra.sl)} · TP=${fmtPrice1(extra.tp)}`, evtClass);
      appendStreamLine(
        `<span class="prompt">&gt;</span> → Entering ${sideStr} @ ${fmtPrice1(extra.entryPrice)}`, evtClass);
    } else if (kind === 'exit') {
      const pnl = extra.pnl;
      const hit = extra.hit; // 'target' | 'stop'
      const pnlClass = pnl >= 0 ? 'event-win' : 'event-loss';
      const sign = pnl >= 0 ? '+' : '−';
      const abs = Math.abs(Math.round(pnl));
      appendStreamLine(
        `<span class="prompt">&gt;</span> ${hit === 'target' ? 'target hit' : 'stop hit'}`,
        evtClass);
      appendStreamLine(
        `<span class="prompt">&gt;</span> closing ${sideStr} @ ${fmtPrice1(extra.exitPrice)}`,
        evtClass);
      appendStreamLine(
        `<span class="prompt">&gt;</span> P&L: ${sign}$${abs}`, pnlClass);
    }
  }

  // Determine the algo's desired position given the current time.
  // Real mode: look at the next swing; synthetic: current swing direction.
  function desiredPosition() {
    if (dataMode === 'real') {
      const t = nowMs() - simStartTime;
      const idx = wrapBarIdx(getBarIdxAt(t));
      const next = findNextSwingAfter(idx);
      if (!next) return 0;
      return next.type === 'high' ? 1 : -1;
    }
    const t = nowMs() - simStartTime;
    const swing = getSwingAt(t);
    return swing.direction === 'up' ? 1 : -1;
  }

  function algoOnCandleClose() {
    candleCounter++;
    tickPreviousTradeMarkers();
    // Exits are handled intra-tick by algoOnTick (SL/TP checks). This function
    // only handles ENTRIES now.
    if (algo.position !== 0) return;
    const desired = desiredPosition();
    if (desired === 0) return;
    if (candleCounter < algo.cooldownUntilCandle) return;
    // Only enter if the reward-to-risk ratio is at least 1.5:1 — this filters
    // out setups where the stop would be too far or the target too close.
    if (!hasFavorableRR(desired)) return;
    if (desired === 1) algoBuy();
    else               algoShort();
  }

  function algoBuy() {
    rolloverTradeMarkers();
    algo.position = 1;
    algo.entryPrice = currentPrice;
    algo.stopLoss = computeStopLoss(1);
    algo.takeProfit = computeTakeProfit(1);
    attachTradeMarker(currentCandle, 'long_entry', undefined, algo.stopLoss);
    openTradeViz(currentCandle, algo.stopLoss, algo.takeProfit);
    logStreamEvent('entry', 1, {
      entryPrice: algo.entryPrice, sl: algo.stopLoss, tp: algo.takeProfit,
    });
  }

  function algoShort() {
    rolloverTradeMarkers();
    algo.position = -1;
    algo.entryPrice = currentPrice;
    algo.stopLoss = computeStopLoss(-1);
    algo.takeProfit = computeTakeProfit(-1);
    attachTradeMarker(currentCandle, 'short_entry', undefined, algo.stopLoss);
    openTradeViz(currentCandle, algo.stopLoss, algo.takeProfit);
    logStreamEvent('entry', -1, {
      entryPrice: algo.entryPrice, sl: algo.stopLoss, tp: algo.takeProfit,
    });
  }

  function algoClose() {
    const side = algo.position;
    const priceMove = side === 1
      ? currentPrice - algo.entryPrice
      : algo.entryPrice - currentPrice;
    const pnl = priceMove * POSITION_SIZE;
    algo.totalTrades++;
    if (pnl > 0) algo.wins++; else algo.losses++;
    algo.totalPnL += pnl;

    // Record the closed trade for the recent-trades list.
    let timeStr;
    if (dataMode === 'real' && bars) {
      const t = nowMs() - simStartTime;
      const idx = wrapBarIdx(getBarIdxAt(t));
      timeStr = new Date(bars[idx].time).toLocaleTimeString('en-GB', {
        hour: '2-digit', minute: '2-digit', hour12: false,
        timeZone: 'America/New_York',
      });
    } else {
      timeStr = new Date().toLocaleTimeString('en-GB', {
        hour: '2-digit', minute: '2-digit', hour12: false,
        timeZone: 'America/New_York',
      });
    }
    recentTrades.unshift({
      side: side === 1 ? 'Long' : 'Short',
      pnl,
      time: timeStr,
      entry: algo.entryPrice,
      exit:  currentPrice,
    });
    if (recentTrades.length > 5) recentTrades.length = 5;
    tradesVersion++;

    attachTradeMarker(currentCandle,
      side === 1 ? 'long_exit' : 'short_exit', pnl);
    // Detect whether this was a target hit or a stop hit (based on direction
    // and which level price crossed).
    const hit = pnl >= 0 ? 'target' : 'stop';
    logStreamEvent('exit', side, { pnl, hit, exitPrice: currentPrice });
    // Flash all candles from entry to exit in black, win or loss.
    if (activeTradeViz && activeTradeViz.entryCandle) {
      flashCandleRange(activeTradeViz.entryCandle, currentCandle, 0x111111);
    }
    closeTradeViz();
    algo.position = 0;
    algo.entryPrice = 0;
    algo.cooldownUntilCandle = candleCounter +
      ENTRY_COOLDOWN_MIN + Math.floor(algoRng() *
        (ENTRY_COOLDOWN_MAX - ENTRY_COOLDOWN_MIN + 1));
  }

  // Build a text label as a canvas-backed sprite. Sprites always face the
  // camera, so labels stay readable at any tilt. Returns a THREE.Sprite.
  function makeTextSprite(lines, defaultColor = '#111', options = {}) {
    const PAD_X = 9, PAD_Y = 8;
    const noBox = !!options.noBox;
    const FONT_TITLE = 'bold 18px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
    const FONT_SUB   = '600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
    // Line-height per font size (rough rule: fontSize * 1.33).
    const fontLineHeight = f => {
      const m = f.match(/(\d+)px/);
      return m ? Math.round(parseInt(m[1], 10) * 1.33) : 22;
    };
    // Normalize: strings become default-style objects.
    const items = lines.map((ln, i) => {
      if (typeof ln === 'string') {
        return {
          text: ln,
          font: i === 0 ? FONT_TITLE : FONT_SUB,
          color: i === 0 ? defaultColor : '#333',
        };
      }
      return {
        text: ln.text,
        font: ln.font || (i === 0 ? FONT_TITLE : FONT_SUB),
        color: ln.color || (i === 0 ? defaultColor : '#333'),
      };
    });

    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    // Icon width (relative to font size). The token "[CLK]" in any line is
    // replaced visually by a flat 2D clock icon of this width.
    const CLOCK_TOKEN = '[CLK]';
    const ICON_W_RATIO = 0.95; // icon width ≈ fontSize * ratio
    const pxFor = font => {
      const m = font.match(/(\d+)px/);
      return m ? parseInt(m[1], 10) : 14;
    };
    function measureLineWithIcon(text, font) {
      ctx.font = font;
      const parts = text.split(CLOCK_TOKEN);
      const iconW = pxFor(font) * ICON_W_RATIO;
      let w = 0;
      for (let i = 0; i < parts.length; i++) {
        w += ctx.measureText(parts[i]).width;
        if (i < parts.length - 1) w += iconW;
      }
      return w;
    }

    // Measure each line with its own font.
    let maxW = 0;
    for (const it of items) {
      const w = measureLineWithIcon(it.text, it.font);
      if (w > maxW) maxW = w;
    }
    // Sum line heights to get total content height.
    const lineHeights = items.map(it => fontLineHeight(it.font));
    const totalLineH = lineHeights.reduce((a, b) => a + b, 0);

    const DPR = 2;
    canvas.width  = Math.ceil((maxW + PAD_X * 2) * DPR);
    canvas.height = Math.ceil((totalLineH + PAD_Y * 2) * DPR);
    ctx.scale(DPR, DPR);
    const W = canvas.width / DPR, H = canvas.height / DPR;
    // Rounded-rect background with a black border (uniform across all labels).
    // Suppress entirely for simple text-only labels (e.g., time axis marks).
    if (!noBox) {
      ctx.fillStyle = 'rgba(255, 255, 255, 0.96)';
      ctx.strokeStyle = '#111';
      ctx.lineWidth = 1.5;
      const r = 8;
      ctx.beginPath();
      ctx.moveTo(r, 0);
      ctx.lineTo(W - r, 0);
      ctx.quadraticCurveTo(W, 0, W, r);
      ctx.lineTo(W, H - r);
      ctx.quadraticCurveTo(W, H, W - r, H);
      ctx.lineTo(r, H);
      ctx.quadraticCurveTo(0, H, 0, H - r);
      ctx.lineTo(0, r);
      ctx.quadraticCurveTo(0, 0, r, 0);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }
    // Render each line at its own height offset. Lines containing the
    // [CLK] token get a flat 2D clock icon drawn in that position.
    ctx.textBaseline = 'middle';
    let y = PAD_Y;
    for (let i = 0; i < items.length; i++) {
      ctx.font = items[i].font;
      ctx.fillStyle = items[i].color;
      const fontPx = pxFor(items[i].font);
      const iconW  = fontPx * ICON_W_RATIO;
      const iconR  = iconW * 0.42; // icon radius relative to its cell
      const parts  = items[i].text.split(CLOCK_TOKEN);
      const cy     = y + lineHeights[i] / 2;
      let x = PAD_X;
      for (let j = 0; j < parts.length; j++) {
        ctx.font = items[i].font;
        ctx.fillStyle = items[i].color;
        ctx.fillText(parts[j], x, cy);
        x += ctx.measureText(parts[j]).width;
        if (j < parts.length - 1) {
          // Draw a flat 2D clock: circle outline + hour hand + minute hand.
          const cxIcon = x + iconW / 2;
          ctx.save();
          ctx.strokeStyle = items[i].color;
          ctx.fillStyle   = items[i].color;
          ctx.lineWidth = Math.max(1, fontPx * 0.09);
          ctx.lineCap = 'round';
          // Circle outline.
          ctx.beginPath();
          ctx.arc(cxIcon, cy, iconR, 0, Math.PI * 2);
          ctx.stroke();
          // Center dot.
          ctx.beginPath();
          ctx.arc(cxIcon, cy, Math.max(0.5, fontPx * 0.05), 0, Math.PI * 2);
          ctx.fill();
          // Minute hand — points to 12 (straight up), length 0.7 of radius.
          ctx.beginPath();
          ctx.moveTo(cxIcon, cy);
          ctx.lineTo(cxIcon, cy - iconR * 0.70);
          ctx.stroke();
          // Hour hand — points to 3 (right), length 0.45 of radius.
          ctx.beginPath();
          ctx.moveTo(cxIcon, cy);
          ctx.lineTo(cxIcon + iconR * 0.45, cy);
          ctx.stroke();
          ctx.restore();
          x += iconW;
        }
      }
      y += lineHeights[i];
    }
    const tex = new THREE.CanvasTexture(canvas);
    tex.needsUpdate = true;
    const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 1,
      depthTest: false });
    const sprite = new THREE.Sprite(mat);
    // World size scales with canvas content size so text stays at a consistent
    // per-line visual size. 0.027 = 1.5x the previous 0.018.
    const WORLD_PER_PX = 0.027;
    const worldH = (canvas.height / DPR) * WORLD_PER_PX;
    const worldW = (canvas.width  / DPR) * WORLD_PER_PX;
    sprite.scale.set(worldW, worldH, 1);
    return sprite;
  }

  // Attach a cone + text label for a single trade event.
  //   pnl      (exits only): realized P&L, shown as a 3rd line.
  //   stopLoss (entries only): SL price level, shown as a 3rd line AND as a
  //                            thin red horizontal bar on the chart.
  function attachTradeMarker(candle, type, pnl, stopLoss) {
    const isEntry = type === 'long_entry'  || type === 'short_entry';
    const isLong  = type === 'long_entry'  || type === 'long_exit';
    const pointsUp = isLong === isEntry;  // long entry & short exit point up
    const color = isLong ? GREEN_HEX : RED_HEX;
    const colorCss = isLong ? '#2f9b2f' : '#d03a3f';

    // --- Cone ---
    const coneGeom = new THREE.ConeGeometry(0.3, 0.55, 10);
    const coneMat = new THREE.MeshLambertMaterial({ color,
      transparent: true, opacity: 1 });
    const cone = new THREE.Mesh(coneGeom, coneMat);
    const baseY = pointsUp
      ? priceToY(candle.low) - 0.9
      : priceToY(candle.high) + 0.9;
    cone.position.y = baseY;
    if (!pointsUp) cone.rotation.x = Math.PI;
    candle.group.add(cone);
    candle.markers.push(cone);
    trackMarker(cone, candle);
    cone.scale.set(0.01, 0.01, 0.01);
    cone.userData.bornAt = performance.now();

    // --- Text label ---
    const titleMap = {
      long_entry:  'Long entry',
      long_exit:   'Long exit',
      short_entry: 'Short entry',
      short_exit:  'Short exit',
    };
    // Time: if we have real data, use the bar timestamp; else use wall clock.
    // 24-hour clock in New York time (native S&P trading timezone).
    let timeStr;
    if (dataMode === 'real' && bars) {
      const t = nowMs() - simStartTime;
      const idx = wrapBarIdx(getBarIdxAt(t));
      timeStr = new Date(bars[idx].time).toLocaleTimeString('en-GB', {
        hour: '2-digit', minute: '2-digit', hour12: false,
        timeZone: 'America/New_York',
      });
    } else {
      timeStr = new Date().toLocaleTimeString('en-GB', {
        hour: '2-digit', minute: '2-digit', hour12: false,
        timeZone: 'America/New_York',
      });
    }
    const priceLine = isEntry
      ? `@ ${fmtPrice1(currentPrice)}  [CLK] ${timeStr}`
      : `${fmtPrice1(currentPrice)}  [CLK] ${timeStr}`;
    const lines = [
      titleMap[type],
      priceLine,
    ];
    // Exit labels: P&L as a prominent colored line, "$" prefix, no decimals.
    if (pnl !== undefined) {
      lines.push({
        text: signedDollar(pnl),
        font: 'bold 22px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
        color: pnl >= 0 ? '#2f9b2f' : '#d03a3f',
      });
    }
    // (stopLoss is no longer added to entry labels — it's shown on-chart only.)
    const sprite = makeTextSprite(lines, colorCss);
    // Capture full scale for positioning BEFORE we scale it down for pop-in.
    const labelHalfH = sprite.scale.y / 2;
    // Position the label on the outer side of the cone, offset so the label's
    // inner edge sits just past the cone tip.
    sprite.position.y = pointsUp
      ? baseY - labelHalfH - 0.4
      : baseY + labelHalfH + 0.4;
    sprite.position.x = 0;
    sprite.position.x = 0;
    // Sprite must render on top of the cone. renderOrder fires after other
    // meshes, and depthTest:false (already set in makeTextSprite) prevents
    // the cone from z-culling the sprite.
    sprite.renderOrder = 10;
    candle.group.add(sprite);
    candle.markers.push(sprite);
    trackMarker(sprite, candle);
    sprite.scale.multiplyScalar(0.01);
    sprite.userData.bornAt = performance.now();
    sprite.userData.fullScale = sprite.scale.clone().multiplyScalar(100);
  }

  // ============ ACTIVE TRADE VISUALIZATION (SL + TP planes + labels) ============
  let activeTradeViz = null;

  function makeLevelPlane(color) {
    const plane = new THREE.Mesh(
      new THREE.BoxGeometry(1, 0.08, CANDLE_D * 1.3),
      new THREE.MeshBasicMaterial({
        color,
        transparent: true,
        opacity: 0.45,
      })
    );
    plane.renderOrder = 5;
    return plane;
  }

  function makeLevelLabel(text, color) {
    const label = makeTextSprite([{
      text,
      font: 'bold 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
      color,
    }]);
    label.renderOrder = 21;
    return label;
  }

  const REVEAL_DURATION = 1000; // ms — planes grow from entry to future
  const LABEL_FADE_IN_MS = 300; // ms — labels fade in after reveal

  function openTradeViz(entryCandle, slPrice, tpPrice) {
    const entryPrice = algo.entryPrice;
    const enPlane = makeLevelPlane(0x888888);
    const slPlane = makeLevelPlane(0xFF4F55);
    const tpPlane = makeLevelPlane(0x51C951);
    const enLabel = makeLevelLabel(`Entry @ ${fmtPrice1(entryPrice)}`, '#444');
    const slLabel = makeLevelLabel(`SL @ ${fmtPrice1(slPrice)}`, '#d03a3f');
    const tpLabel = makeLevelLabel(`TP @ ${fmtPrice1(tpPrice)}`, '#2f9b2f');
    // Start with labels invisible — they fade in after reveal completes.
    for (const lbl of [enLabel, slLabel, tpLabel]) lbl.material.opacity = 0;
    rotationGroup.add(enPlane, slPlane, tpPlane, enLabel, slLabel, tpLabel);
    activeTradeViz = {
      enPlane, slPlane, tpPlane, enLabel, slLabel, tpLabel,
      entryCandle, entryPrice, slPrice, tpPrice,
      revealStart: performance.now(),
    };
  }

  function updateActiveTradeViz() {
    if (!activeTradeViz || !currentCandle) return;
    const { enPlane, slPlane, tpPlane, enLabel, slLabel, tpLabel,
            entryCandle, entryPrice, slPrice, tpPrice, revealStart } = activeTradeViz;
    const entryX  = entryCandle.group.position.x;
    const latestX = currentCandle.group.position.x;
    const fullFutureX = latestX + SPACING * 3;
    const entryOpacity = entryCandle.bodyMat.opacity;

    // Reveal animation: grow rightward from entry candle's left edge.
    // Left edge is anchored; right edge sweeps from entryX → fullFutureX.
    const elapsed = performance.now() - revealStart;
    const revealT = Math.min(elapsed / REVEAL_DURATION, 1);
    const eased = 1 - Math.pow(1 - revealT, 3); // ease-out cubic
    const leftEdge  = entryX - CANDLE_W * 0.4;
    const fullRight = fullFutureX + CANDLE_W * 0.4;
    const currRight = leftEdge + (fullRight - leftEdge) * eased;
    const width     = Math.max(currRight - leftEdge, 0.001);
    const centerX   = (leftEdge + currRight) / 2;
    const labelX    = fullRight + SPACING * 0.3; // sits just past the right edge

    // Labels fade in starting when reveal is ~85% done.
    const labelFadeT = Math.max(0, Math.min(
      (elapsed - REVEAL_DURATION * 0.85) / LABEL_FADE_IN_MS, 1));

    // Entry (grey).
    enPlane.position.x = centerX;
    enPlane.position.y = priceToY(entryPrice);
    enPlane.scale.x = width;
    enPlane.material.opacity = 0.40 * entryOpacity;
    enLabel.position.x = labelX;
    enLabel.position.y = priceToY(entryPrice);
    enLabel.material.opacity = entryOpacity * labelFadeT;

    // SL.
    slPlane.position.x = centerX;
    slPlane.position.y = priceToY(slPrice);
    slPlane.scale.x = width;
    slPlane.material.opacity = 0.45 * entryOpacity;
    slLabel.position.x = labelX;
    slLabel.position.y = priceToY(slPrice);
    slLabel.material.opacity = entryOpacity * labelFadeT;

    // TP.
    tpPlane.position.x = centerX;
    tpPlane.position.y = priceToY(tpPrice);
    tpPlane.scale.x = width;
    tpPlane.material.opacity = 0.45 * entryOpacity;
    tpLabel.position.x = labelX;
    tpLabel.position.y = priceToY(tpPrice);
    tpLabel.material.opacity = entryOpacity * labelFadeT;
  }

  function closeTradeViz() {
    if (!activeTradeViz) return;
    const { enPlane, slPlane, tpPlane, enLabel, slLabel, tpLabel } = activeTradeViz;
    for (const obj of [enPlane, slPlane, tpPlane, enLabel, slLabel, tpLabel]) {
      rotationGroup.remove(obj);
      if (obj.geometry) obj.geometry.dispose();
      if (obj.material) {
        if (obj.material.map) obj.material.map.dispose();
        obj.material.dispose();
      }
    }
    activeTradeViz = null;
  }

  // ============ CANDLE FLASH (trade-close emphasis) ============
  // When a trade closes, briefly tint all candles between the entry and exit
  // black, then fade back to natural color. Same color for wins and losses.
