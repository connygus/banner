  const FLASH_DURATION = 1500; // ms — lingers long enough to be clearly felt

  function flashCandleRange(fromCandle, toCandle, flashHex) {
    const fromIdx = candles.indexOf(fromCandle);
    const toIdx   = candles.indexOf(toCandle);
    if (fromIdx < 0 || toIdx < 0) return;
    const start = Math.min(fromIdx, toIdx);
    const end   = Math.max(fromIdx, toIdx);
    const now = performance.now();
    for (let i = start; i <= end; i++) {
      candles[i].flashColor = flashHex;
      candles[i].flashUntil = now + FLASH_DURATION;
    }
  }

  // Called every frame. Overrides candle body/wick color during active flash.
  const _flashNaturalColor = new THREE.Color();
  const _flashHexColor     = new THREE.Color();

  function updateCandleFlashes() {
    const now = performance.now();
    for (const c of candles) {
      if (!c.flashUntil) continue;
      const remaining = c.flashUntil - now;
      const natural = c.isGreen ? GREEN_HEX : RED_HEX;
      if (remaining <= 0) {
        // Flash done — restore body to natural color (wick stays black).
        c.flashUntil = undefined;
        c.bodyMat.color.setHex(natural);
      } else {
        // Ease body from flash color back to natural.
        const t = 1 - (remaining / FLASH_DURATION);
        _flashHexColor.setHex(c.flashColor);
        _flashNaturalColor.setHex(natural);
        _flashHexColor.lerp(_flashNaturalColor, t);
        c.bodyMat.color.copy(_flashHexColor);
      }
    }
  }

  // ============ ON-CHART PRICE LABEL ============
  // Follows the current candle, shows symbol + current price. Canvas is
  // reused across frames; only the texture is re-uploaded when it changes.
  let chartPriceCanvas = null, chartPriceCtx = null, chartPriceTex = null,
      chartPriceSprite = null, chartPriceLastText = '';

  function initChartPriceLabel() {
    const DPR = 2;
    // Keep original text size; just trim trailing whitespace on the right.
    const W_CSS = 128, H_CSS = 64;
    chartPriceCanvas = document.createElement('canvas');
    chartPriceCanvas.width  = W_CSS * DPR;
    chartPriceCanvas.height = H_CSS * DPR;
    chartPriceCtx = chartPriceCanvas.getContext('2d');
    chartPriceTex = new THREE.CanvasTexture(chartPriceCanvas);
    chartPriceTex.needsUpdate = true;
    const mat = new THREE.SpriteMaterial({
      map: chartPriceTex,
      transparent: true,
      depthTest: false,
    });
    chartPriceSprite = new THREE.Sprite(mat);
    chartPriceSprite.renderOrder = 50;
    const WORLD_PER_PX = 0.022;
    chartPriceSprite.scale.set(W_CSS * WORLD_PER_PX, H_CSS * WORLD_PER_PX, 1);
    rotationGroup.add(chartPriceSprite);
  }

  function redrawChartPriceLabel() {
    if (!chartPriceCtx || !currentCandle) return;
    const symbol = 'S&P 500';
    const priceText = fmtPrice(displayedPrice);
    const fullText = symbol + '|' + priceText;
    if (fullText === chartPriceLastText) return;
    chartPriceLastText = fullText;

    const ctx = chartPriceCtx;
    const DPR = 2;
    const W = chartPriceCanvas.width / DPR;
    const H = chartPriceCanvas.height / DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    // Medium-dark grey background (softer than near-black).
    ctx.fillStyle = 'rgba(58, 58, 62, 0.96)';
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.5)';
    ctx.lineWidth = 1.2;
    const r = 7;
    ctx.beginPath();
    ctx.moveTo(r, 0);
    ctx.lineTo(W - r, 0);
    ctx.quadraticCurveTo(W, 0, W, r);
    ctx.lineTo(W, H - r);
    ctx.quadraticCurveTo(W, H, W - r, H);
    ctx.lineTo(r, H);
    ctx.quadraticCurveTo(0, H, 0, H - r);
    ctx.lineTo(0, r);
    ctx.quadraticCurveTo(0, 0, r, 0);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    // Symbol label — white.
    const PAD = 8;
    ctx.textBaseline = 'top';
    ctx.font = '700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
    ctx.fillStyle = '#fff';
    ctx.fillText(symbol, PAD, PAD);
    // Price — white, bigger.
    ctx.font = 'bold 24px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
    ctx.fillStyle = '#fff';
    ctx.fillText(priceText, PAD, PAD + 22);
    chartPriceTex.needsUpdate = true;
  }

  function updateChartPriceLabel() {
    if (!chartPriceSprite || !currentCandle) return;
    redrawChartPriceLabel();
    // Position to the right of the current candle so it doesn't overlap.
    chartPriceSprite.position.x =
      currentCandle.group.position.x + SPACING * 3.2;
    chartPriceSprite.position.y =
      priceToY(currentCandle.close) + chartPriceSprite.scale.y * 0.35;
  }

  function updateMarkerAnimations() {
    const now = performance.now();
    for (const c of candles) {
      for (const m of c.markers) {
        const born = m.userData.bornAt;
        if (born === undefined) continue;
        const t = (now - born) / 260;
        // Sprites store their target scale (non-uniform) in userData.fullScale;
        // cones/meshes target uniform scale (1,1,1).
        const full = m.userData.fullScale;
        if (t >= 1) {
          if (full) m.scale.copy(full);
          else      m.scale.set(1, 1, 1);
          delete m.userData.bornAt;
        } else {
          const eased = 1 - Math.pow(1 - t, 3);
          const overshoot = 1 + Math.sin(t * Math.PI) * 0.35;
          const s = eased * overshoot;
          if (full) m.scale.set(full.x * s, full.y * s, full.z * s);
          else      m.scale.set(s, s, s);
        }
      }
    }
  }

  // ============ MOUSE TILT ============
  let targetRotY = 0, targetRotX = 0;
  window.addEventListener('mousemove', (e) => {
    targetRotY =  ((e.clientX / window.innerWidth)  - 0.5) * 0.45;
    targetRotX = -((e.clientY / window.innerHeight) - 0.5) * 0.18;
  });
  window.addEventListener('mouseleave', () => {
    targetRotY = 0; targetRotX = 0;
  });

  // ============ UI ============
  const recentTradesListEl = document.getElementById('recentTradesList');

  // Format a price with thousands separators when the magnitude warrants it.
  const fmtPrice = p => p.toLocaleString('en-US', {
    minimumFractionDigits: 2, maximumFractionDigits: 2,
  });
  const signed = v => (v >= 0 ? '+' : '−') + fmtPrice(Math.abs(v));
  // Signed dollar amount with no decimals: "+$500" / "−$65".
  const signedDollar = v => {
    const sign = v >= 0 ? '+' : '−';
    const abs = Math.abs(Math.round(v));
    return `${sign}$${abs.toLocaleString('en-US')}`;
  };
  // One-decimal price formatter for SL/TP levels.
  const fmtPrice1 = p => p.toLocaleString('en-US', {
    minimumFractionDigits: 1, maximumFractionDigits: 1,
  });

  // Throttled, tick-quantized price for display.
  const DISPLAY_TICK = 0.05;
  const DISPLAY_THROTTLE_MS = 120;
  let displayedPrice = BASE_PRICE;
  let lastDisplayedPriceMs = 0;
  function updateDisplayedPrice() {
    const now = performance.now();
    if (now - lastDisplayedPriceMs < DISPLAY_THROTTLE_MS) return;
    lastDisplayedPriceMs = now;
    displayedPrice = Math.round(currentPrice / DISPLAY_TICK) * DISPLAY_TICK;
  }

  function updateUI() {
    // Bottom panels are gone; all that's left is the Recent Trades list.
    renderRecentTrades();
  }

  // Animated render. Each trade row is keyed by trade.time + pnl so we can
  // diff DOM against `recentTrades`: new rows animate in from the top, rows
  // that exist on both sides stay put (CSS transitions handle their shift
  // down via the new sibling pushing them), and removed rows fade out.
  let lastTradesVersionRendered = -1;
  const RENDERED_MAX = 5;
  function tradeKey(tr) {
    // time+side+pnl is unique enough for our short list.
    return `${tr.time}|${tr.side}|${Math.round(tr.pnl)}`;
  }
  function buildTradeRow(tr) {
    const row = document.createElement('div');
    row.className = 'trade-row';
    row.dataset.key = tradeKey(tr);
    const side = document.createElement('span');
    side.className = 'trade-side ' + tr.side.toLowerCase();
    side.textContent = tr.side;
    const time = document.createElement('span');
    time.className = 'trade-time';
    time.textContent = tr.time;
    const pnl = document.createElement('span');
    pnl.className = 'trade-pnl ' + (tr.pnl >= 0 ? 'up' : 'down');
    pnl.textContent = signedDollar(tr.pnl);
    row.append(side, time, pnl);
    return row;
  }

  function renderRecentTrades() {
    if (tradesVersion === lastTradesVersionRendered) return;
    lastTradesVersionRendered = tradesVersion;

    // Empty-list placeholder.
    if (recentTrades.length === 0) {
      recentTradesListEl.innerHTML = '<div class="no-trades">No closed trades yet</div>';
      return;
    }
    // If this is the first render (placeholder present), wipe and insert all
    // rows without animation so the initial fake-seeded list doesn't flicker.
    const hasPlaceholder = recentTradesListEl.querySelector('.no-trades');
    if (hasPlaceholder) {
      recentTradesListEl.innerHTML = '';
      for (const tr of recentTrades.slice(0, RENDERED_MAX)) {
        recentTradesListEl.appendChild(buildTradeRow(tr));
      }
      return;
    }

    // Diff: collect existing keys in DOM vs desired keys in recentTrades.
    const existingRows = Array.from(recentTradesListEl.children);
    const existingKeys = existingRows.map(r => r.dataset.key);
    const desired = recentTrades.slice(0, RENDERED_MAX);
    const desiredKeys = desired.map(tradeKey);

    // FLIP step 1: capture current positions of rows that will survive, so
    // we can animate them smoothly to their new positions after DOM changes.
    const surviving = existingRows.filter(r =>
      desiredKeys.includes(r.dataset.key) && !r.classList.contains('trade-row-leaving'));
    const firstRects = new Map();
    for (const row of surviving) {
      firstRects.set(row, row.getBoundingClientRect());
    }

    // Remove rows whose key no longer appears (oldest trade that got pushed
    // out by new ones). Fade them out downward, then remove.
    for (const row of existingRows) {
      if (!desiredKeys.includes(row.dataset.key)) {
        row.classList.add('trade-row-leaving');
        setTimeout(() => { if (row.parentNode) row.parentNode.removeChild(row); }, 1150);
      }
    }

    // Insert new rows at their correct positions (newest first).
    for (let i = 0; i < desired.length; i++) {
      const key = desiredKeys[i];
      if (existingKeys.includes(key)) continue;
      const row = buildTradeRow(desired[i]);
      row.classList.add('trade-row-entering');
      const refNode = recentTradesListEl.children[i] || null;
      recentTradesListEl.insertBefore(row, refNode);
      // Fade/slide in on next frame so the transition fires.
      requestAnimationFrame(() => {
        requestAnimationFrame(() => row.classList.remove('trade-row-entering'));
      });
    }

    // FLIP step 2: for each surviving row, measure its new position, apply
    // the inverse transform instantly, then transition to identity so it
    // appears to slide from old → new position.
    for (const row of surviving) {
      const first = firstRects.get(row);
      const last = row.getBoundingClientRect();
      const dy = first.top - last.top;
      if (Math.abs(dy) < 0.5) continue;
      // Apply inverse instantly — disable transition to snap to the old spot.
      row.style.transition = 'none';
      row.style.transform = `translateY(${dy}px)`;
      // Force a reflow so the browser commits the snap, then re-enable
      // transition and clear the transform so it animates into place.
      row.offsetHeight; // eslint-disable-line no-unused-expressions
      row.style.transition = '';
      row.style.transform = '';
    }
  }

  // ============ PREFILL ============
  // Run the full sim for MAX_CANDLES-1 historical candles so the chart
  // starts already "full" — visible uptrend, past trade markers, and
  // non-zero algo stats from frame 1.
  function prefillHistory() {
    currentPrice = BASE_PRICE;
    const ticksPerCandle = 60;
    const dt = CANDLE_DURATION / ticksPerCandle;

    for (let i = 0; i < PREFILL_COUNT; i++) {
      const virtualStart = simStartTime + i * CANDLE_DURATION;

      // Let the algo evaluate the previous virtual candle close.
      virtualNow = virtualStart;
      if (currentCandle) algoOnCandleClose();

      // Open the new historical candle at the current (virtual) price.
      currentCandle = new Candle(currentPrice);
      rotationGroup.add(currentCandle.group);
      candles.push(currentCandle);
      maybeAttachTimeLabel(currentCandle);

      // Simulate this candle's ticks without rebuilding geometry each step
      // — we only finalize geometry once at the end for performance.
      for (let t = 0; t < ticksPerCandle; t++) {
        virtualNow = virtualStart + (t + 0.5) * dt;
        tickPrice();
        if (currentPrice > currentCandle.high) currentCandle.high = currentPrice;
        if (currentPrice < currentCandle.low)  currentCandle.low  = currentPrice;
        currentCandle.close = currentPrice;
        algoOnTick();
      }
      // Single geometry rebuild with the final OHLC.
      currentCandle.update(currentPrice);
    }

    virtualNow = null; // back to real time
  }

  // ============ START ============
  async function init() {
    const loadingEl = document.getElementById('loading');

    // Try fetching real S&P data. A short timeout keeps page load snappy even
    // if the proxy is slow — synthetic fallback is fine.
    const fetchPromise = fetchMarketBars();
    const timeoutPromise = new Promise(r => setTimeout(() => r(null), 8000));
    const fetched = await Promise.race([fetchPromise, timeoutPromise]);

    if (fetched && fetched.bars.length > MAX_CANDLES + 10) {
      dataMode   = 'real';
      bars       = fetched.bars;
      realSymbol = fetched.symbol;

      // Pick the PREVIOUS trading day (never today). Bars are timestamped
      // in ms UTC. For grouping, we use the UTC date (fast — no Intl per
      // bar). The S&P session 09:30-16:00 NY always falls within one UTC
      // day, so UTC-date grouping correctly separates sessions.
      const TZ = 'America/New_York';
      // For the "today" check: the NY date corresponds to the UTC date if
      // we subtract ~5h (EST) or 4h (EDT). Shifting "now" by -5h UTC gives
      // us a point that's reliably within the NY calendar day. We then
      // take the UTC date of that shifted point — matches the format of
      // bars' UTC date strings.
      const nowShifted = Date.now() - 5 * 3600 * 1000;
      const todayDateStr = new Date(nowShifted).toISOString().slice(0, 10);
      // Count bars per UTC-date string (proxy for NY session date).
      const dateCounts = new Map();
      const dateBarIndices = new Map();
      for (let i = 0; i < bars.length; i++) {
        const d = new Date(bars[i].time).toISOString().slice(0, 10);
        dateCounts.set(d, (dateCounts.get(d) || 0) + 1);
        if (!dateBarIndices.has(d)) dateBarIndices.set(d, [i, i]);
        else dateBarIndices.get(d)[1] = i;
      }
      // Pick the most recent date that isn't today and has at least 200 bars
      // (filters half-days / data gaps). Never pick today's session.
      const sortedDates = [...dateCounts.keys()].sort();
      let chosenDate = null;
      for (let i = sortedDates.length - 1; i >= 0; i--) {
        const d = sortedDates[i];
        if (d === todayDateStr) continue;  // always skip today
        if (dateCounts.get(d) >= 200) { chosenDate = d; break; }
      }
      let startIdx, endIdx;
      if (chosenDate) {
        [startIdx, endIdx] = dateBarIndices.get(chosenDate);
        endIdx += 1; // make endIdx exclusive to match [start, end) convention
      } else {
        // Fallback: last contiguous block of bars.
        startIdx = Math.max(0, bars.length - 390);
        endIdx = bars.length;
      }

      // Use the day window if we have enough prefill room before it;
      // otherwise fall back to the last ~390 bars we have.
      if (endIdx - startIdx >= PREFILL_COUNT + 2 && startIdx >= PREFILL_COUNT) {
        dataStartBarIdx = startIdx;
        LOOP_LENGTH = endIdx - startIdx;
      } else {
        LOOP_LENGTH = Math.min(390, bars.length - PREFILL_COUNT - 1);
        dataStartBarIdx = bars.length - LOOP_LENGTH;
      }

      // Store the hour range for the UI title.
      replayWindowStart = bars[dataStartBarIdx].time;
      replayWindowEnd   = bars[dataStartBarIdx + LOOP_LENGTH - 1].time + 60000;

      // Compute swing extrema — but scale the zigzag threshold to the
      // window's actual volatility. A 60-min S&P window can span anywhere
      // from 5 points (calm) to 80+ points (news-driven), so a fixed %
      // threshold doesn't work across conditions.
      let minP = Infinity, maxP = -Infinity;
      for (let i = dataStartBarIdx; i < dataStartBarIdx + LOOP_LENGTH; i++) {
        if (bars[i].low  < minP) minP = bars[i].low;
        if (bars[i].high > maxP) maxP = bars[i].high;
      }
      const winRange   = Math.max(maxP - minP, 0.01);
      const avgPrice   = (maxP + minP) / 2;
      const rangePct   = winRange / avgPrice;
      // Swings have to be at least 20% of the window's range to matter, with
      // a floor of 0.02% so we detect something even in ultra-calm windows.
      const swingThreshold = Math.max(rangePct * 0.20, 0.0002);

      const allSwings = computeSwings(bars, swingThreshold);
      dataSwings = allSwings.filter(s =>
        s.barIdx >= dataStartBarIdx && s.barIdx < dataStartBarIdx + LOOP_LENGTH);

      // Fallback: if zigzag still found fewer than 2 swings in the window
      // (can happen on a near-flat monotonic drift), do a simple local-extrema
      // scan that always produces something.
      if (dataSwings.length < 2) {
        console.log('[chart] zigzag found', dataSwings.length,
          'swings — falling back to local extrema scan');
        dataSwings = findLocalExtrema(bars, dataStartBarIdx,
          dataStartBarIdx + LOOP_LENGTH, 4);
      }

      // Auto-fit the chart's world-space scale to the actual price range.
      // Include prefill bars so the chart doesn't clip them.
      const windowStart = Math.max(0, dataStartBarIdx - PREFILL_COUNT);
      const windowEnd   = dataStartBarIdx + LOOP_LENGTH;
      for (let i = windowStart; i < windowEnd; i++) {
        if (bars[i].low  < minP) minP = bars[i].low;
        if (bars[i].high > maxP) maxP = bars[i].high;
      }
      // PRICE_SCALE: calibrate so a TYPICAL bar's wick extent (high-low)
      // maps to roughly 4 world units of vertical space. Sample the first 30
      // bars of the session (the open, what users see first). This gives
      // candles a substantial, visible presence on the chart.
      const openingBarCount = Math.min(30, LOOP_LENGTH);
      let openRangeSum = 0;
      for (let i = 0; i < openingBarCount; i++) {
        openRangeSum += bars[dataStartBarIdx + i].high - bars[dataStartBarIdx + i].low;
      }
      const openAvgRange = (openRangeSum / openingBarCount) || 0.5;
      // Target: avg wick extent ≈ 4 world units (~9% of the 43-unit frustum).
      PRICE_SCALE = 4.0 / Math.max(openAvgRange, 0.1);
      // Safety clamp: prevent the PRICE_SCALE from becoming absurdly large
      // on ultra-calm days where a single bar's open range is tiny. Compute
      // the largest local 25-bar extent and only clamp if it would truly
      // overflow — the rotationGroup auto-centers on current price, so we
      // can be generous here (extent up to 40 world units is still OK since
      // the camera tracks the baseline). This clamp rarely triggers.
      let maxLocalExtent = 0;
      const localWindowBars = 25;
      for (let i = dataStartBarIdx; i < windowEnd - localWindowBars; i++) {
        let lo = Infinity, hi = -Infinity;
        for (let j = 0; j < localWindowBars; j++) {
          const b = bars[i + j];
          if (b.low  < lo) lo = b.low;
          if (b.high > hi) hi = b.high;
        }
        const extent = hi - lo;
        if (extent > maxLocalExtent) maxLocalExtent = extent;
      }
      const maxAllowedScale = 40 / Math.max(maxLocalExtent, 0.01);
      if (PRICE_SCALE > maxAllowedScale) PRICE_SCALE = maxAllowedScale;
      // Anchor BASE_PRICE so the chart starts near world Y = 0. Use the
      // average of the prefill window so candles aren't piled above or below.
      let sumP = 0, cnt = 0;
      for (let i = windowStart; i < dataStartBarIdx; i++) { sumP += bars[i].close; cnt++; }
      BASE_PRICE        = cnt > 0 ? sumP / cnt : bars[dataStartBarIdx].open;
      smoothedTrendline = BASE_PRICE;
      // Real data doesn't have a guaranteed uptrend — let smoothedTrendline
      // re-center the chart dynamically. Small positive lift shifts the whole
      // chart slightly upward on screen so it sits higher in the viewport.
      UPTREND_LIFT = 8;

      // Position time-axis slabs based on the FIRST 45 bars (~90 seconds of
      // replay — what most users see before leaving the page). Take the
      // minimum price of that opening window, convert to world Y, and place
      // the slabs a fixed distance below it. This keeps time labels visually
      // anchored to the opening candles regardless of where prices end up
      // later in the session.
      const openingLookBars = Math.min(45, LOOP_LENGTH);
      let openMinP = Infinity;
      for (let i = 0; i < openingLookBars; i++) {
        if (bars[dataStartBarIdx + i].low < openMinP) {
          openMinP = bars[dataStartBarIdx + i].low;
        }
      }
      // Slab Y in rotationGroup-local coords. priceToY gives world Y of the
      // min price; subtract an aesthetic offset so labels sit below the wick.
      TIME_SLAB_Y = priceToY(openMinP) - 2.5;

      // Fill in the replay-range text — date in NY time, e.g. "Tuesday, April 21st".
      const replayRangeEl = document.getElementById('replayRange');
      if (replayRangeEl) {
        const TZ = 'America/New_York';
        // Weekday in NY time.
        const weekday = new Date(replayWindowStart).toLocaleDateString('en-US', {
          weekday: 'long', timeZone: TZ,
        });
        // Month name in NY time.
        const monthName = new Date(replayWindowStart).toLocaleDateString('en-US', {
          month: 'long', timeZone: TZ,
        });
        // Day of month in NY time.
        const dayNum = parseInt(new Intl.DateTimeFormat('en-US', {
          day: 'numeric', timeZone: TZ,
        }).format(new Date(replayWindowStart)), 10);
        // English ordinal suffix: 1st, 2nd, 3rd, 4th-20th, 21st, 22nd, 23rd, 24th-30th, 31st.
        const ordinal = (n) => {
          const mod100 = n % 100;
          if (mod100 >= 11 && mod100 <= 13) return 'th';
          switch (n % 10) {
            case 1: return 'st';
            case 2: return 'nd';
            case 3: return 'rd';
            default: return 'th';
          }
        };
        replayRangeEl.textContent = `${weekday}, ${monthName} ${dayNum}${ordinal(dayNum)}`;
      }

      console.log('[chart] real-data mode',
        '| window:', LOOP_LENGTH, 'bars',
        '| window range:', winRange.toFixed(2), `(${(rangePct*100).toFixed(3)}%)`,
        '| swing threshold:', (swingThreshold*100).toFixed(3) + '%',
        '| swings:', dataSwings.length,
        '| price range:', minP.toFixed(2), '–', maxP.toFixed(2),
        '| latest:', new Date(bars[bars.length-1].time).toLocaleString());

      // Seed fake historical trades (4 wins, 1 loss) from the hour before
      // the replay window, so the Recent Trades list is populated on load.
      seedFakeTrades();
    } else {
      console.log('[chart] synthetic mode — no real data available');
    }

    // Hide the loading overlay and launch the chart.
    if (loadingEl) {
      loadingEl.classList.add('hidden');
      setTimeout(() => loadingEl.remove(), 500);
    }

    prefillHistory();
    startCandle();
    initChartPriceLabel();
    animate();
  }

  init();

  function animate() {
    requestAnimationFrame(animate);

    tickPrice();
    if (currentCandle) currentCandle.update(currentPrice);
    algoOnTick();

    if (performance.now() - candleStartTime >= CANDLE_DURATION) {
      startCandle();
    }

    // Continuous horizontal scroll. Old candles gently fade out in opacity
    // over the last FADE_ZONE slots — no shrinking, just a subtle fade.
    const FADE_ZONE = 4;
    const progress = Math.min((performance.now() - candleStartTime) / CANDLE_DURATION, 1);
    const offset = -progress * SPACING;
    const latestIdx = candles.length - 1;
    for (let i = 0; i < candles.length; i++) {
      const indexFromLatest = latestIdx - i;
      candles[i].group.position.x = LATEST_X - indexFromLatest * SPACING + offset;

      // Fractional age: grows smoothly as the next candle is forming.
      const age = indexFromLatest + progress;
      const fadeStart = MAX_CANDLES - 1 - FADE_ZONE;
      let opacity = 1;
      if (age > fadeStart) {
        const t = Math.min((age - fadeStart) / FADE_ZONE, 1);
        opacity = Math.max(0, 1 - t); // linear fade
      }
      candles[i].setOpacity(opacity);
    }

    rotationGroup.rotation.y += (targetRotY - rotationGroup.rotation.y) * 0.06;
    rotationGroup.rotation.x += (targetRotX - rotationGroup.rotation.x) * 0.06;

    // Follow the rising baseline so the chart stays in view, and lift it by
    // UPTREND_LIFT so history reads as a clear diagonal climb (latest near
    // the top of view, oldest near the bottom) rather than a flat oscillation.
    const baselineRise = getBaseline() - BASE_PRICE;
    rotationGroup.position.y = -baselineRise * PRICE_SCALE + UPTREND_LIFT;

    updateMarkerAnimations();
    updateDissolvingMarkers();
    updateActiveTradeViz();
    updateCandleFlashes();
    tickCodeStream();
    updateDisplayedPrice();
    updateChartPriceLabel();
    updateUI();

    renderer.render(scene, camera);
  }
</script>
</body>
