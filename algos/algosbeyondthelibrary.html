<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProRealAlgos — Beyond the algos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { overflow: hidden; }
:root {
  --pra-bg:        #FFFFFF;
  --pra-ink:       #0E0E10;
  --pra-red:       #EC3B3D;
  --pra-green:     #3DC574;
  --pra-muted:     #6B6B72;
  --pra-line:      #E8E8EA;
  --pra-soft:      #F6F6F7;
  --pra-font-sans: 'Onest', system-ui, -apple-system, sans-serif;
  --pra-font-mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  --pra-r-card:    22px;
  --pra-r-pill:    999px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  margin: 0;
  font-family: var(--pra-font-sans);
  color: var(--pra-ink);
  background: var(--pra-bg);
  -webkit-font-smoothing: antialiased;
  line-height: 1.5;
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: 0; background: transparent; }
.container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

.t-h2 { font-weight: 700; font-size: clamp(28px, 3.6vw, 44px); line-height: 1.1; letter-spacing: -0.015em; }
.t-lead { font-size: 18px; line-height: 1.5; color: var(--pra-muted); }
.t-eyebrow {
  font-family: var(--pra-font-mono); font-weight: 500; font-size: 12px;
  letter-spacing: 0.12em; text-transform: uppercase; color: var(--pra-muted);
}
.accent { color: var(--pra-red); }
.tag {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px;
  font-family: var(--pra-font-mono); font-size: 10.5px; font-weight: 500;
  letter-spacing: 0.03em;
  border-radius: var(--pra-r-pill);
  background: var(--pra-soft); color: var(--pra-ink);
  white-space: nowrap;
}

.sx-head {
  display: grid; grid-template-columns: 1.3fr 1fr;
  gap: 48px; align-items: end; margin-bottom: 32px;
}
.sx-head h2 { max-width: 560px; margin-top: 10px; }
.sx-head .lead { padding-bottom: 4px; max-width: 440px; }
@media (max-width: 800px) { .sx-head { grid-template-columns: 1fr; gap: 16px; } }

/* ============================================================
   TABBED LIBRARY
   ============================================================ */
.s-tabs { padding: 96px 0; background: var(--pra-bg); }

.lib-tabs {
  display: flex; gap: 6px; flex-wrap: nowrap;
  padding: 6px;
  background: var(--pra-soft);
  border-radius: var(--pra-r-pill);
  margin-bottom: 22px;
  width: max-content;
  max-width: 100%;
  overflow-x: auto;
  scrollbar-width: none;
}
.lib-tabs::-webkit-scrollbar { display: none; }
.lib-tab {
  padding: 10px 15px;
  font-family: var(--pra-font-sans);
  font-size: 13.5px; font-weight: 500;
  color: var(--pra-ink);
  border-radius: var(--pra-r-pill);
  display: inline-flex; align-items: center; gap: 8px;
  white-space: nowrap;
  transition: all 120ms ease;
}
.lib-tab:hover { background: rgba(14,14,16,0.05); }
.lib-tab.active { background: var(--pra-ink); color: #fff; }
.lib-tab .tab-count {
  font-family: var(--pra-font-mono);
  font-size: 10.5px;
  background: rgba(14,14,16,0.06);
  padding: 1px 7px;
  border-radius: var(--pra-r-pill);
  letter-spacing: 0.04em;
}
.lib-tab.active .tab-count { background: rgba(255,255,255,0.16); color: rgba(255,255,255,0.85); }

.lib-tab-content {
  background: var(--pra-bg);
  border: 1px solid var(--pra-line);
  border-radius: var(--pra-r-card);
  padding: 30px;
}
.lib-tab-head {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 20px; flex-wrap: wrap; gap: 12px;
}
.lib-tab-head .tt { font-size: 21px; font-weight: 600; letter-spacing: -0.012em; }
.lib-tab-head .tt small {
  font-family: var(--pra-font-mono); font-size: 12px;
  font-weight: 500; color: var(--pra-muted);
  margin-left: 8px; letter-spacing: 0.02em;
}
.lib-tab-head .meta {
  font-family: var(--pra-font-mono);
  font-size: 11px; color: var(--pra-muted);
  letter-spacing: 0.06em;
}

.lib-item-grid {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 14px;
}
@media (max-width: 900px) { .lib-item-grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 700px) { .lib-item-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 480px) { .lib-item-grid { grid-template-columns: 1fr; } }

.li-card {
  background: var(--pra-bg);
  border: 1px solid var(--pra-line);
  border-radius: 14px;
  padding: 14px;
  display: flex; flex-direction: column;
  gap: 8px;
  transition: border-color 120ms ease;
  cursor: default;
}
.li-thumb {
  height: 80px;
  background: var(--pra-soft);
  border-radius: 8px;
  position: relative;
  overflow: hidden;
}
.li-thumb svg { width: 100%; height: 100%; display: block; }
.li-thumb.li-code { background: #0E0E10; padding: 10px; display: flex; align-items: center; }
.li-thumb.li-code .code {
  font-family: var(--pra-font-mono); font-size: 8.5px;
  color: rgba(255,255,255,0.72); line-height: 1.55; white-space: nowrap;
}
.li-thumb.li-play { background: linear-gradient(135deg, #0E0E10, #2a2a30); display: flex; align-items: center; justify-content: center; color: #fff; }
.li-thumb.li-target { background: rgba(236,59,61,0.10); display: flex; align-items: center; justify-content: center; color: var(--pra-red); }
.li-thumb.li-play svg, .li-thumb.li-target svg { width: auto; height: auto; }
.li-thumb.li-mini { display: flex; align-items: center; justify-content: center; }
.li-thumb.li-mini .mini-n { font-family: var(--pra-font-mono); font-weight: 600; font-size: 20px; color: var(--pra-muted); }
.li-thumb.li-mini svg { width: auto; height: auto; color: var(--pra-muted); }
.li-thumb.li-icon { display: flex; align-items: center; justify-content: center; color: var(--pra-muted); }
.li-thumb.li-icon svg { width: auto; height: auto; }
.li-thumb.li-photo { background: var(--pra-soft); }
.li-thumb.li-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.li-badge {
  position: absolute; top: 6px; left: 6px;
  background: var(--pra-bg);
  padding: 2px 7px;
  border-radius: var(--pra-r-pill);
  font-family: var(--pra-font-mono); font-size: 9px;
  letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--pra-muted); font-weight: 500;
}
.li-badge.red { background: var(--pra-red); color: #fff; }
.li-badge.green { background: var(--pra-green); color: #fff; }
.li-badge.pop { background: #fff; color: var(--pra-ink); border: 1px solid rgba(14,14,16,0.12); box-shadow: 0 1px 4px rgba(14,14,16,0.16); font-weight: 600; }
.li-cat {
  font-family: var(--pra-font-mono);
  font-size: 9.5px; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--pra-muted);
}
.li-name { font-size: 13.5px; font-weight: 600; letter-spacing: -0.005em; line-height: 1.3; }
.li-flag { font-size: 13.5px; vertical-align: 1px; }
.li-meta {
  font-family: var(--pra-font-mono); font-size: 10.5px;
  color: var(--pra-muted); letter-spacing: 0.04em;
  margin-top: auto;
}

/* spotlight feature card for single-product categories */
.li-feature {
  grid-column: 1 / -1;
  flex-direction: row; align-items: stretch; gap: 24px;
  padding: 22px; cursor: default;
}
.li-feature:hover { transform: none; border-color: var(--pra-line); }
.li-feature .li-thumb { width: 300px; min-height: 178px; height: auto; flex-shrink: 0; }
.li-feature .lf-body { display: flex; flex-direction: column; min-width: 0; }
.lf-name { font-size: 22px; font-weight: 700; letter-spacing: -0.015em; margin-top: 3px; line-height: 1.12; }
.lf-desc { color: var(--pra-muted); font-size: 14.5px; line-height: 1.55; margin-top: 9px; max-width: 660px; }
.lf-incl { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.lf-cta {
  margin-top: 18px; align-self: flex-start;
  display: inline-flex; gap: 8px; align-items: center;
  background: var(--pra-ink); color: #fff;
  padding: 11px 20px; border-radius: var(--pra-r-pill);
  font-size: 13.5px; font-weight: 600;
  transition: background 140ms ease, gap 140ms ease;
}
.lf-cta:hover { background: var(--pra-red); gap: 11px; }
@media (max-width: 700px) {
  .li-feature { flex-direction: column; }
  .li-feature .li-thumb { width: 100%; min-height: 170px; }
}

.li-subhead {
  grid-column: 1 / -1;
  font-family: var(--pra-font-mono);
  font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--pra-muted);
  margin-top: 10px; padding-top: 20px;
  border-top: 1px solid var(--pra-line);
}

@media (max-width: 510px) {
  .s-tabs { padding: 64px 0; }
  .container { padding: 0 20px; }
  .lib-tab-content { padding: 20px; }
}
</style>
</head>
<body>

<section class="s-tabs">
  <div class="container">

    <div class="sx-head">
      <div>
        <span class="t-eyebrow">The library</span>
        <h2 class="t-h2">Beyond the algos.</h2>
      </div>
      <p class="t-lead lead">Indicators, research, code, and full courses. Everything else in the ProRealAlgos catalog that's included with your license.</p>
    </div>

    <div class="lib-tabs" id="libTabs" role="tablist"></div>

    <div class="lib-tab-content">
      <div class="lib-tab-head">
        <div class="tt" id="ttTitle"></div>
        <div class="meta" id="ttMeta"></div>
      </div>
      <div class="lib-item-grid" id="libBody"></div>
    </div>

  </div>
</section>

<script>
/* ============================================================
   DATA — real products from prorealalgos.com
   ============================================================ */
const SPARKS = [
  "0,52 22,49 44,55 66,43 88,36 110,41 132,29 154,37 176,25 200,15",
  "0,60 25,55 50,58 75,46 100,49 125,33 150,37 175,24 200,17",
  "0,38 22,42 44,55 66,64 88,58 110,47 132,51 154,38 176,42 200,30",
  "0,30 25,37 50,31 75,44 100,39 125,50 150,46 175,55 200,50",
  "0,66 28,60 56,52 84,43 112,38 140,29 168,22 200,15",
  "0,46 22,41 44,49 66,38 88,45 110,34 132,41 154,30 176,37 200,24"
];
function sparkSVG(v, area){
  const pts = SPARKS[(v||0) % SPARKS.length];
  const fill = area ? `<polyline points="0,80 ${pts} 200,80" fill="rgba(61,197,116,0.10)" stroke="none"/>` : '';
  return `<svg viewBox="0 0 200 80" preserveAspectRatio="none">${fill}<polyline points="${pts}" fill="none" stroke="#0E0E10" stroke-width="1.6"/></svg>`;
}
function candlesSVG(){
  const xs=[18,30,42,54,66,78,90,102,114,126,138,150,162,174];
  const d=[[40,22],[34,30],[46,14,'r'],[30,34],[24,44],[38,26,'r'],[20,48],[16,54],[28,36,'g'],[12,58],[14,54],[24,38,'g'],[10,60],[16,50]];
  let r=''; d.forEach((c,i)=>{ const col=c[2]==='r'?'#EC3B3D':(c[2]==='g'?'#3DC574':'#0E0E10'); r+=`<rect x="${xs[i]}" y="${c[0]}" width="3" height="${c[1]}" fill="${col}"/>`; });
  return `<svg viewBox="0 0 200 80" preserveAspectRatio="none">${r}</svg>`;
}
const oscSVG = () => `<svg viewBox="0 0 200 80" preserveAspectRatio="none"><line x1="0" y1="40" x2="200" y2="40" stroke="#E8E8EA" stroke-dasharray="2 2"/><path d="M0,40 Q33,12 66,40 T132,40 T200,40" fill="none" stroke="#0E0E10" stroke-width="1.6"/></svg>`;
const bandSVG = () => `<svg viewBox="0 0 200 80" preserveAspectRatio="none"><path d="M0,24 Q50,14 100,22 T200,18" fill="none" stroke="#6b6b72" stroke-width="1"/><path d="M0,56 Q50,66 100,58 T200,62" fill="none" stroke="#6b6b72" stroke-width="1"/><polyline points="0,40 25,36 50,44 75,34 100,42 125,32 150,40 175,30 200,34" fill="none" stroke="#0E0E10" stroke-width="1.6"/></svg>`;
const channelSVG = () => `<svg viewBox="0 0 200 80" preserveAspectRatio="none"><line x1="0" y1="26" x2="200" y2="18" stroke="#3DC574" stroke-width="1"/><line x1="0" y1="60" x2="200" y2="52" stroke="#EC3B3D" stroke-width="1"/><polyline points="0,46 20,40 40,36 60,52 80,38 100,28 120,32 140,42 160,36 180,26 200,20" fill="none" stroke="#0E0E10" stroke-width="1.6"/></svg>`;
const multiMASVG = () => `<svg viewBox="0 0 200 80" preserveAspectRatio="none"><polyline points="0,66 30,60 60,52 90,44 120,37 150,27 180,21 200,16" fill="none" stroke="#0E0E10" stroke-width="1.8"/><polyline points="0,68 30,64 60,58 90,52 120,46 150,38 180,32 200,28" fill="none" stroke="#6b6b72" stroke-width="1"/><polyline points="0,70 30,67 60,63 90,58 120,53 150,46 180,40 200,36" fill="none" stroke="#6b6b72" stroke-width="1" opacity="0.55"/><polyline points="0,72 30,70 60,67 90,63 120,59 150,53 180,48 200,44" fill="none" stroke="#6b6b72" stroke-width="1" opacity="0.35"/></svg>`;
const seasonalSVG = () => `<svg viewBox="0 0 200 80" preserveAspectRatio="none"><rect x="60" y="0" width="34" height="80" fill="#EC3B3D" opacity="0.07"/><rect x="140" y="0" width="34" height="80" fill="#3DC574" opacity="0.07"/><polyline points="0,40 18,42 36,54 54,62 72,60 90,48 108,40 126,28 144,32 162,40 180,24 200,16" fill="none" stroke="#0E0E10" stroke-width="1.6"/></svg>`;
const sessionsSVG = () => `<svg viewBox="0 0 200 80" preserveAspectRatio="none"><rect x="20" y="0" width="40" height="80" fill="#0E0E10" opacity="0.05"/><rect x="90" y="0" width="50" height="80" fill="#3DC574" opacity="0.08"/><rect x="160" y="0" width="30" height="80" fill="#EC3B3D" opacity="0.06"/><polyline points="0,50 25,46 50,52 75,40 100,36 125,42 150,32 175,38 200,30" fill="none" stroke="#0E0E10" stroke-width="1.4"/></svg>`;
const barsSVG = () => `<svg viewBox="0 0 200 80" preserveAspectRatio="none">${[28,44,20,52,34].map((h,i)=>`<rect x="${22+i*36}" y="${72-h}" width="20" height="${h}" rx="2" fill="${i===3?'#3DC574':'#0E0E10'}" opacity="${i===3?'1':'0.82'}"/>`).join('')}</svg>`;
const playSVG = () => `<svg viewBox="0 0 48 48" width="34" height="34" fill="currentColor" aria-hidden="true"><polygon points="17,11 37,24 17,37"/></svg>`;
const targetSVG = () => `<svg viewBox="0 0 48 48" width="38" height="38" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="24" cy="24" r="17"/><circle cx="24" cy="24" r="8"/><line x1="24" y1="4" x2="24" y2="11"/><line x1="24" y1="37" x2="24" y2="44"/><line x1="4" y1="24" x2="11" y2="24"/><line x1="37" y1="24" x2="44" y2="24"/></svg>`;

/* ---- realistic indicator mini-charts, brand-colored, modeled on the real ProRealTime previews ---- */
function rng(seed){ let s=(seed>>>0)||1; return function(){ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; }; }
function geomX(i,n){ return 8 + 244*i/(n-1); }
function genCandles(seed,o){ o=o||{}; const n=o.n||28, top=o.top!=null?o.top:12, bot=o.bot!=null?o.bot:74, vol=o.vol||5, drift=o.drift||0; const r=rng(seed); const cs=[]; let prev=(top+bot)/2; for(let i=0;i<n;i++){ const op=prev; let c=op+(r()-0.5)*vol*2+drift; c=Math.max(top+5,Math.min(bot-5,c)); cs.push({o:op,c:c,hi:Math.min(op,c)-(r()*3+0.8),lo:Math.max(op,c)+(r()*3+0.8),up:c<op}); prev=c; } return cs; }
function candleSVG(cs){ const n=cs.length, dx=244/(n-1), bw=Math.max(2.6,dx*0.5); let s=''; for(let i=0;i<n;i++){ const k=cs[i], x=geomX(i,n), col=k.up?'#3DC574':'#EC3B3D', ty=Math.min(k.o,k.c), h=Math.max(1.3,Math.abs(k.c-k.o)); s+=`<line x1="${x.toFixed(1)}" y1="${k.hi.toFixed(1)}" x2="${x.toFixed(1)}" y2="${k.lo.toFixed(1)}" stroke="${col}" stroke-width="0.9"/><rect x="${(x-bw/2).toFixed(1)}" y="${ty.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="${col}"/>`; } return s; }
function midArr(cs){ return cs.map(k=>(k.o+k.c)/2); }
function smaArr(a,p){ const o=[]; for(let i=0;i<a.length;i++){ let s=0,c=0; for(let j=Math.max(0,i-p+1);j<=i;j++){s+=a[j];c++;} o.push(s/c);} return o; }
function polyFrom(v,n,st,w,d){ let pts=''; for(let i=0;i<v.length;i++) pts+=geomX(i,n).toFixed(1)+','+v[i].toFixed(1)+' '; return `<polyline points="${pts.trim()}" fill="none" stroke="${st}" stroke-width="${w}"${d?` stroke-dasharray="${d}"`:''} stroke-linejoin="round"/>`; }
function bandPoly(top,bot,n,fill){ let p=''; for(let i=0;i<n;i++)p+=geomX(i,n).toFixed(1)+','+top[i].toFixed(1)+' '; for(let i=n-1;i>=0;i--)p+=geomX(i,n).toFixed(1)+','+bot[i].toFixed(1)+' '; return `<polygon points="${p.trim()}" fill="${fill}"/>`; }
function chartWrap(inner){ return `<svg viewBox="0 0 260 88" preserveAspectRatio="none"><rect width="260" height="88" fill="#F2F4F9"/>${inner}</svg>`; }
function mkChart(kind){
  let cs,n;
  switch(kind){
    case 'htfma': { cs=genCandles(11,{drift:-0.4,vol:4}); n=cs.length; const m=midArr(cs); return chartWrap(candleSVG(cs)+polyFrom(smaArr(m,16),n,'#A6ABB6',1.6)+polyFrom(smaArr(m,9),n,'#6B6B72',1.4)+polyFrom(smaArr(m,4),n,'#0E0E10',1.5)); }
    case 'maangle': { cs=genCandles(7,{vol:4}); n=cs.length; const a=smaArr(midArr(cs),6); let seg=''; for(let i=1;i<n;i++){ const sl=a[i-1]-a[i]; const col=sl>0.4?'#3DC574':(sl<-0.4?'#EC3B3D':'#6B6B72'); seg+=`<line x1="${geomX(i-1,n).toFixed(1)}" y1="${a[i-1].toFixed(1)}" x2="${geomX(i,n).toFixed(1)}" y2="${a[i].toFixed(1)}" stroke="${col}" stroke-width="2.2" stroke-linecap="round"/>`; } const li=n-1; const ang=`<line x1="${geomX(li-3,n).toFixed(1)}" y1="${a[li-3].toFixed(1)}" x2="${(geomX(li,n)+6).toFixed(1)}" y2="${a[li-3].toFixed(1)}" stroke="#6B6B72" stroke-width="0.7" stroke-dasharray="2 2"/>`; return chartWrap(candleSVG(cs)+ang+seg); }
    case 'bollinger': { cs=genCandles(23,{drift:-0.5,vol:4}); n=cs.length; const mid=smaArr(midArr(cs),5); const gu=mid.map(v=>v-16), gd=mid.map(v=>v-7), ru=mid.map(v=>v+7), rd=mid.map(v=>v+16); return chartWrap(bandPoly(gu,gd,n,'rgba(61,197,116,0.20)')+bandPoly(ru,rd,n,'rgba(236,59,61,0.16)')+candleSVG(cs)+polyFrom(gd,n,'rgba(61,197,116,0.75)',0.9)+polyFrom(gu,n,'rgba(61,197,116,0.5)',0.8)+polyFrom(ru,n,'rgba(236,59,61,0.65)',0.9)+polyFrom(rd,n,'rgba(236,59,61,0.45)',0.8)); }

function upArrow(x,y,col){ return `<path d="M${x.toFixed(1)},${y.toFixed(1)} l-3,5 h6 z" fill="${col||'#3DC574'}"/>`; }
function edgeDot(x,y,col,r){ return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r||2.3}" fill="${col}"/>`; }
function seasonalEdge(two){
  const r=rng(two?71:73), n=24; const pts=[];
  for(let i=0;i<n;i++){ const seas=Math.sin((i/n)*6.283-1.1)*11; pts.push(46 - seas + (r()-0.5)*3); }
  let line=''; for(let i=0;i<n;i++) line+=geomX(i,n).toFixed(1)+','+pts[i].toFixed(1)+' ';
  const bands = two
    ? `<rect x="116" y="0" width="32" height="88" fill="rgba(236,59,61,0.10)"/><rect x="196" y="0" width="34" height="88" fill="rgba(61,197,116,0.12)"/>`
    : `<rect x="150" y="0" width="40" height="88" fill="rgba(236,59,61,0.11)"/>`;
  return bands+`<polyline points="${line.trim()}" fill="none" stroke="#0E0E10" stroke-width="1.8" stroke-linejoin="round"/>`;
}

    case 'hull': { C(53,{vol:4}); const a=smaArr(smaArr(m,3),3); let s=''; for(let i=1;i<n;i++){ const up=a[i]<=a[i-1]; s+=`<line x1="${geomX(i-1,n).toFixed(1)}" y1="${a[i-1].toFixed(1)}" x2="${geomX(i,n).toFixed(1)}" y2="${a[i].toFixed(1)}" stroke="${up?'#3DC574':'#EC3B3D'}" stroke-width="2.4" stroke-linecap="round"/>`; } return chartWrap(candleSVG(cs)+s); }
    case 'donchian': { C(57,{vol:5}); const hi=[],lo=[]; for(let i=0;i<n;i++){ let h=999,l=-999; for(let j=Math.max(0,i-5);j<=i;j++){ h=Math.min(h,cs[j].hi); l=Math.max(l,cs[j].lo); } hi.push(h); lo.push(l); } return chartWrap(bandPoly(hi,lo,n,'rgba(107,107,114,0.06)')+polyFrom(hi,n,'#3DC574',1.1)+polyFrom(lo,n,'#EC3B3D',1.1)+candleSVG(cs)); }
    case 'ma200': { C(59,{vol:4,drift:-0.45}); const a=smaArr(m,15); let p=''; for(let i=0;i<n;i++) p+=geomX(i,n).toFixed(1)+','+a[i].toFixed(1)+' '; return chartWrap(`<polygon points="8,84 ${p}252,84" fill="rgba(61,197,116,0.08)"/>`+candleSVG(cs)+polyFrom(a,n,'#0E0E10',2.1)); }

    case 'threedown': { C(63,{vol:3.4,drift:0.55}); let minI=0; for(let i=1;i<n;i++) if(cs[i].lo>cs[minI].lo) minI=i; const hlx=geomX(Math.max(0,minI-3),n); const hl=`<rect x="${hlx.toFixed(1)}" y="2" width="${(geomX(minI,n)-hlx).toFixed(1)}" height="84" fill="rgba(236,59,61,0.07)"/>`; return chartWrap(hl+candleSVG(cs)+upArrow(geomX(minI,n), cs[minI].lo+7, '#3DC574')); }
    case 'atr': { C(67,{vol:5}); const a=smaArr(m,5); const rg=[]; for(let i=0;i<n;i++){ let s=0,c=0; for(let j=Math.max(0,i-4);j<=i;j++){ s+=(cs[j].lo-cs[j].hi); c++; } rg.push(Math.abs(s/c)); } const up=a.map((vv,i)=>vv-rg[i]*1.2-3), lo=a.map((vv,i)=>vv+rg[i]*1.2+3); return chartWrap(bandPoly(up,lo,n,'rgba(107,107,114,0.10)')+candleSVG(cs)+polyFrom(up,n,'#6B6B72',0.9)+polyFrom(lo,n,'#6B6B72',0.9)); }

function badge(p){ return p.badge ? `<span class="li-badge ${p.badge[0]}">${p.badge[1]}</span>` : ''; }
function thumb(p){
  const t = p.thumb || ['spark',0]; const k = t[0]; const b = badge(p);
  if (k === 'chart')  return `<div class="li-thumb">${b}${mkChart(t[1])}</div>`;
  if (k === 'edge')   return `<div class="li-thumb">${b}${mkEdge(t[1])}</div>`;
  if (k === 'icon')   return `<div class="li-thumb li-icon">${b}${mkIcon(t[1])}</div>`;
  if (k === 'photo')  return `<div class="li-thumb li-photo">${b}<img src="${t[1]}" alt="" loading="lazy"></div>`;
  if (k === 'code')   return `<div class="li-thumb li-code">${b}<span class="code">${t[1].join('<br>')}</span></div>`;
  if (k === 'play')   return `<div class="li-thumb li-play">${b}${playSVG()}</div>`;
  if (k === 'target') return `<div class="li-thumb li-target">${b}${targetSVG()}</div>`;
  let svg;
  switch (k) {
    case 'candles':  svg = candlesSVG(); break;
    case 'osc':      svg = oscSVG(); break;
    case 'band':     svg = bandSVG(); break;
    case 'channel':  svg = channelSVG(); break;
    case 'multima':  svg = multiMASVG(); break;
    case 'seasonal': svg = seasonalSVG(); break;
    case 'sessions': svg = sessionsSVG(); break;
    case 'bars':     svg = barsSVG(); break;
    default:         svg = sparkSVG(t[1], t[2] === 'area');
  }
  return `<div class="li-thumb">${b}${svg}</div>`;
}

/* ============================================================
   RENDER
   ============================================================ */
function cardHTML(p){
  return `<div class="li-card" data-cat="${p.cat}">${thumb(p)}<div class="li-cat">${p.catLabel}</div><div class="li-name">${p.flag?`<span class="li-flag">${p.flag}</span> `:''}${p.name}</div>${p.meta?`<div class="li-meta">${p.meta}</div>`:''}</div>`;
}
function inclCard(i){
  const th = i.thumb ? thumb(i) : `<div class="li-thumb li-mini"><span class="mini-n">${i.n||'·'}</span></div>`;
  return `<div class="li-card">${th}<div class="li-cat">${i.cat}</div><div class="li-name">${i.name}</div>${i.meta?`<div class="li-meta">${i.meta}</div>`:''}</div>`;
}
function featureCard(p){
  return `<div class="li-card li-feature">${thumb(p)}<div class="lf-body"><div class="li-cat">${p.catLabel}</div><div class="lf-name">${p.name}</div><p class="lf-desc">${p.desc}</p><div class="lf-incl">${(p.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('')}</div></div></div>`;
}

const libTabs = document.getElementById('libTabs');
const libBody = document.getElementById('libBody');
const ttTitle = document.getElementById('ttTitle');
const ttMeta  = document.getElementById('ttMeta');

libTabs.innerHTML = CATS.map((c,i) =>
  `<button class="lib-tab${i===0?' active':''}" data-key="${c.key}" role="tab">${c.tab}${c.count!=null?`<span class="tab-count">${c.count}</span>`:''}</button>`
).join('');

function render(key){
  const cat = CATS.find(c => c.key === key) || CATS[0];
  ttTitle.innerHTML = `${cat.title}<small>${cat.small}</small>`;
  ttMeta.textContent = cat.meta;

  let html = '';
  if (cat.single){
    const p = PRODUCTS.find(x => x.cat === key);
    html += featureCard(p);
    if (p.included && p.included.length){
      html += `<div class="li-subhead">${p.inclHead || 'Included'}</div>`;
      html += p.included.map(inclCard).join('');
    }
  } else {
    html += PRODUCTS.filter(p => p.cat === key).map(cardHTML).join('');
  }
  libBody.innerHTML = html;
}

libTabs.querySelectorAll('.lib-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    libTabs.querySelectorAll('.lib-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    render(tab.dataset.key);
  });
});

render('indicators');
